<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MARKO 26</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  color: black;
  font-family: Helvetica, Arial, sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
}

#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: white;
}

.item {
  position: absolute;
  transform-origin: center;
  white-space: nowrap;
  user-select: none;
  pointer-events: none;
  line-height: .85;
}

.item img {
  display: block;
  width: 100%;
  height: auto;
}

#controls {
  position: fixed;
  z-index: 20;
  bottom: 20px;
  left: 20px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.ui-button {
  background: white;
  color: black;
  border: 1px solid black;
  border-radius: 30px;
  padding: 10px 16px;
  font-size: 12px;
  letter-spacing: .02em;
}

.ui-button:hover {
  background: black;
  color: white;
}

#counter {
  position: fixed;
  right: 20px;
  bottom: 24px;
  z-index: 20;
  font-size: 12px;
}

/* GENERAL SCREENS */

.screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  background: white;
}

.screen.active { display: block; }

/* WISH INPUT */

#wish-screen {
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

#wish-screen.active { display: flex; }

#wish-panel {
  width: min(420px, 100%);
  text-align: center;
}

#wish-panel h2 {
  font-size: 24px;
  font-weight: 400;
  margin: 0 0 24px;
}

#wish-input {
  width: 100%;
  border: 0;
  border-bottom: 1px solid black;
  border-radius: 0;
  padding: 12px 4px;
  font: inherit;
  font-size: 18px;
  outline: none;
  text-align: center;
  background: transparent;
}

#wish-submit {
  margin-top: 24px;
}

/* WISH LAUNCH SCREEN */

#thank-you {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 60;
  background: white;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  user-select: none;
}

#thank-you.active {
  display: flex;
}

#throw-instruction {
  position: absolute;
  top: 42px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 10px;
  letter-spacing: .12em;
  font-weight: 400;
}

#your-wish {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 13px;
  font-weight: 400;
  letter-spacing: .02em;
  white-space: nowrap;
  cursor: grab;
  touch-action: none;
  user-select: none;
  will-change: transform, opacity;
}

#your-wish.launching {
  pointer-events: none;
  animation: wish-launch .85s cubic-bezier(.15,.75,.25,1) forwards;
}

@keyframes wish-launch {
  0% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  25% {
    transform: translate(-50%, -58%) scale(1.08);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -160vh) scale(.35);
    opacity: 0;
  }
}

/* THANK YOU AFTER LAUNCH */

#wish-thank-you {
  display: none;
  position: absolute;
  inset: 0;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  background: white;
  cursor: pointer;
  animation: thank-you-appear .7s ease both;
}

#wish-thank-you.show {
  display: flex;
}

#wish-thank-you-image {
  width: 130px;
  height: auto;
  max-height: 180px;
  object-fit: contain;
  margin-bottom: 24px;
}

#wish-thank-you div {
  font-size: 28px;
  font-weight: 400;
}

#wish-thank-you p {
  font-size: 12px;
  font-weight: 400;
  margin-top: 12px;
}

@keyframes thank-you-appear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* HANGMAN */

#hangman-screen {
  overflow-y: auto;
  padding: 30px 20px 60px;
  text-align: center;
}

#hangman-close {
  position: fixed;
  top: 18px;
  right: 20px;
  z-index: 10;
}

.hangman-content {
  position: relative;
  z-index: 2;
  width: min(600px, 100%);
  margin: 45px auto 0;
}

#hangman-drawing {
  width: 180px;
  height: 180px;
  margin: 0 auto 20px;
  overflow: visible;
}

.hm-part {
  display: none;
  fill: none;
  stroke: black;
  stroke-width: 3;
  stroke-linecap: round;
}

#hangman-word {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: center;
  gap: 9px;
  margin: 25px 0;
  color: black;
}

.hm-letter {
  width: 34px;
  min-width: 34px;
  height: 42px;
  border-bottom: 2px solid black;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 27px;
  font-weight: bold;
  line-height: 1;
}

#hangman-letters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
  max-width: 420px;
  margin: 30px auto;
}

.letter-button {
  width: 36px;
  height: 36px;
  border: 1px solid black;
  background: white;
  border-radius: 50%;
  font-size: 13px;
}

.letter-button:disabled {
  opacity: .2;
  cursor: default;
}

#hangman-message {
  min-height: 30px;
  font-size: 14px;
  margin: 20px 0;
}

#win-images {
  position: fixed;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
}

.win-image {
  position: absolute;
  width: 100px;
  height: auto;
  opacity: 0;
  animation: pop-in .45s ease forwards;
}

@keyframes pop-in {
  0% {
    opacity: 0;
    transform: scale(.1) rotate(var(--rotation));
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(var(--rotation));
  }
}

#you-won {
  display: none;
  position: fixed;
  z-index: 5;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: red;
  font-family: Helvetica, Arial, sans-serif;
  font-size: clamp(40px, 12vw, 110px);
  font-weight: 900;
  white-space: nowrap;
  pointer-events: none;
  animation: blink .5s steps(2, start) infinite;
}

@keyframes blink {
  to { visibility: hidden; }
}

/* BEER */

#beer-screen {
  background: #17100a;
  overflow: hidden;
  height: 100dvh;
  touch-action: none;
}

#beer-reveal-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  opacity: 0;
  z-index: 0;
  transition: opacity .25s linear;
}

#beer-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}

#beer-photos {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
}

.beer-photo {
  position: absolute;
  width: clamp(75px, 22vw, 145px);
  height: clamp(75px, 22vw, 145px);
  object-fit: cover;
  box-shadow: 0 3px 15px rgba(0,0,0,.3);
  will-change: transform;
}

#beer-close {
  position: absolute;
  right: 15px;
  top: 15px;
  z-index: 60;
  border: 1px solid rgba(255,255,255,.6);
  background: rgba(0,0,0,.2);
  color: white;
}

/* HELVETICA + LEICHTE SPERRUNG */
* {
  font-family: Helvetica, Arial, sans-serif !important;
  letter-spacing: .035em;
}
</style>
</head>

<body>

<div id="stage"></div>

<div id="controls">
  <button class="ui-button" id="gift-button">GESCHENK</button>
  <button class="ui-button" id="beer-button">BEER</button>
  <button class="ui-button" id="wish-button">ADD WISH +</button>
</div>

<div id="counter">0 / 10</div>

<!-- WISH INPUT -->
<div id="wish-screen" class="screen">
  <div id="wish-panel">
    <h2>MAKE A WISH</h2>
    <input id="wish-input" type="text" placeholder="Your wish..." maxlength="120">
    <br>
    <button class="ui-button" id="wish-submit">SEND WISH</button>
    <br><br>
    <button class="ui-button" id="wish-close">CLOSE</button>
  </div>
</div>

<!-- WISH LAUNCH AND THANK YOU -->
<div id="thank-you">
  <div id="throw-instruction">THROW IT INTO THE UNIVERSE</div>
  <div id="your-wish">YOUR WISH</div>

  <div id="wish-thank-you">
    <img id="wish-thank-you-image" src="1.png" alt="">
    <div>THANK YOU!</div>
    <p>Your wish will soon come true.</p>
  </div>
</div>

<!-- HANGMAN -->
<div id="hangman-screen" class="screen">
  <button class="ui-button" id="hangman-close">CLOSE</button>

  <div id="win-images"></div>
  <div id="you-won">WIN WIN WIN</div>

  <div class="hangman-content">
    <svg id="hangman-drawing" viewBox="0 0 180 180">

      <path class="hm-part" id="hm-1" d="M25 165 H155"/>
      <path class="hm-part" id="hm-2" d="M55 165 V15 H120 V35"/>

      <defs>
        <clipPath id="headClip">
          <circle cx="120" cy="52" r="17"/>
        </clipPath>
      </defs>

      <image
        id="hm-head-photo"
        x="103"
        y="35"
        width="34"
        height="34"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#headClip)"
        style="display:none;"
      />

      <path class="hm-part" id="hm-4" d="M120 69 V112"/>
      <path class="hm-part" id="hm-5" d="M120 80 L95 100"/>
      <path class="hm-part" id="hm-6" d="M120 80 L145 100"/>

    </svg>

    <div id="hangman-word"></div>
    <div id="hangman-letters"></div>
    <div id="hangman-message"></div>
  </div>
</div>

<!-- BEER -->
<div id="beer-screen" class="screen">
  <img id="beer-reveal-photo" src="1.png" alt="">
  <canvas id="beer-canvas"></canvas>
  <div id="beer-photos"></div>
  <button class="ui-button" id="beer-close">CLOSE</button>
</div>

<script>
