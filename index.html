
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARKO — 26</title>

  <style>
    @font-face {
      font-family: "NationalCode";
      src: url("NationalCodePiStd-Universal.otf") format("opentype");
      font-weight: 100 1000;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: white;
      color: black;
      font-family: "NationalCode", sans-serif;
      overflow: hidden;
      cursor: crosshair;
    }

    #canvas-area {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .marko {
      position: absolute;
      white-space: nowrap;
      line-height: 0.9;
      transform: translate(-50%, -50%) rotate(var(--rotation));
      animation: appear 180ms ease-out;
      user-select: none;
    }

    .marko-image {
      position: absolute;
      object-fit: contain;
      transform: translate(-50%, -50%) rotate(var(--rotation));
      animation: appear 180ms ease-out;
      user-select: none;
    }

    @keyframes appear {
      from {
        opacity: 0;
        scale: 0;
      }
      to {
        opacity: 1;
        scale: 1;
      }
    }

    .controls {
      position: fixed;
      left: 20px;
      bottom: 20px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    button {
      font-family: "NationalCode", sans-serif;
      font-size: 15px;
      font-weight: 700;
      background: white;
      color: black;
      border: 1px solid black;
      padding: 11px 16px;
      cursor: pointer;
      transition: background 150ms, color 150ms;
    }

    button:hover {
      background: black;
      color: white;
    }

    #click-counter {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;
      font-size: 15px;
      pointer-events: none;
    }

    /* WISH PANEL */

    #wish-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.96);
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: default;
    }

    .wish-content {
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    .wish-content h2 {
      font-size: 42px;
      margin: 0 0 25px;
      font-weight: 900;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 150px;
      resize: vertical;
      padding: 15px;
      border: 1px solid black;
      border-radius: 0;
      font-family: "NationalCode", sans-serif;
      font-size: 18px;
      background: white;
      color: black;
      outline: none;
    }

    textarea:focus {
      border-width: 2px;
    }

    .wish-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    #close-wish {
      background: transparent;
    }

    /* THANK YOU SCREEN */

    #thank-you-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      background: white;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 20px;
    }

    .thank-you-image {
      position: relative;
      width: min(650px, 80vw);
      height: min(450px, 60vh);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #thank-you-screen h1 {
      position: relative;
      z-index: 1;
      font-size: clamp(50px, 12vw, 130px);
      line-height: 0.85;
      font-weight: 900;
      text-align: center;
      margin: 0;
      color: white;
      mix-blend-mode: difference;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .controls {
        left: 12px;
        bottom: 12px;
        gap: 6px;
      }

      button {
        font-size: 12px;
        padding: 10px 11px;
      }

      #click-counter {
        right: 12px;
        bottom: 17px;
        font-size: 12px;
      }

      .wish-content h2 {
        font-size: 34px;
      }

      .thank-you-image {
        width: 90vw;
        height: 55vh;
      }
    }
  </style>
</head>

<body>

  <div id="canvas-area"></div>

  <div class="controls">
    <button id="download-button">PNG DOWNLOAD ↓</button>
    <button id="wish-button">ADD WISH +</button>
  </div>

  <div id="click-counter">0 / 10</div>

  <!-- WISH PANEL -->

  <div id="wish-panel">
    <div class="wish-content">
      <h2>MAKE A WISH</h2>

      <textarea
        id="wish-input"
        placeholder="Write your wish here..."
      ></textarea>

      <div class="wish-buttons">
        <button id="close-wish">CLOSE ×</button>
        <button id="submit-wish">SEND WISH ↑</button>
      </div>
    </div>
  </div>

  <!-- THANK YOU SCREEN -->

  <div id="thank-you-screen">
    <div class="thank-you-image" id="thank-you-image">
      <h1>THANK<br>YOU</h1>
    </div>
  </div>

  <script>
    const canvasArea = document.getElementById("canvas-area");
    const counterDisplay = document.getElementById("click-counter");

    const wishPanel = document.getElementById("wish-panel");
    const wishInput = document.getElementById("wish-input");

    const thankYouScreen = document.getElementById("thank-you-screen");
    const thankYouImage = document.getElementById("thank-you-image");

    let clickCount = 0;

    const colors = [
      "#ff0000",
      "#0000ff",
      "#00a651",
      "#ff6600",
      "#ff00aa",
      "#8b00ff",
      "#000000",
      "#ffcc00",
      "#00a6a6"
    ];

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomImageNumber() {
      return Math.floor(Math.random() * 16) + 1;
    }

    // CREATE RANDOM TEXT OR IMAGE

    function createMarko() {

      // 5% chance to create an image
      if (Math.random() < 0.05) {
        createRandomImage();
        return;
      }

      const element = document.createElement("div");

      element.className = "marko";
      element.textContent = Math.random() < 0.5 ? "MARKO" : "26";

      const size = random(20, 150);
      const rotation = random(-35, 35);
      const color = colors[Math.floor(Math.random() * colors.length)];
      const weight = Math.floor(random(100, 1001));

      element.style.left = random(0, window.innerWidth) + "px";
      element.style.top = random(0, window.innerHeight) + "px";
      element.style.fontSize = size + "px";
      element.style.fontWeight = weight;
      element.style.color = color;
      element.style.fontStyle = Math.random() < 0.35 ? "italic" : "normal";
      element.style.setProperty("--rotation", rotation + "deg");

      canvasArea.appendChild(element);
    }

    // CREATE RANDOM IMAGE

    function createRandomImage() {
      const image = document.createElement("img");

      image.className = "marko-image";
      image.src = `${randomImageNumber()}.png`;

      const size = random(50, 190);
      const rotation = random(-35, 35);

      image.style.width = size + "px";
      image.style.height = size + "px";

      image.style.left = random(0, window.innerWidth) + "px";
      image.style.top = random(0, window.innerHeight) + "px";

      image.style.setProperty("--rotation", rotation + "deg");

      canvasArea.appendChild(image);
    }

    function updateCounter() {
      counterDisplay.textContent = clickCount + " / 10";
    }

    function resetCanvas() {
      canvasArea.innerHTML = "";
      clickCount = 0;
      updateCounter();
    }

    // CLICK ANYWHERE TO CREATE MARKO CHAOS

    document.addEventListener("click", function(event) {

      if (
        event.target.closest("button") ||
        event.target.closest("#wish-panel") ||
        event.target.closest("#thank-you-screen")
      ) {
        return;
      }

      if (wishPanel.style.display === "flex") {
        return;
      }

      clickCount++;

      if (clickCount >= 10) {
        resetCanvas();
        return;
      }

      for (let i = 0; i < 250; i++) {
        createMarko();
      }

      updateCounter();
    });

    // PNG DOWNLOAD

    document.getElementById("download-button").addEventListener("click", async function() {

      await document.fonts.ready;

      const width = window.innerWidth;
      const height = window.innerHeight;

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const scale = 2;

      canvas.width = width * scale;
      canvas.height = height * scale;

      ctx.scale(scale, scale);

      // White background
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, width, height);

      const elements = document.querySelectorAll(".marko, .marko-image");

      // Wait for all images to load
      const images = Array.from(document.querySelectorAll(".marko-image"));

      await Promise.all(images.map(image => {
        if (image.complete && image.naturalWidth > 0) {
          return Promise.resolve();
        }

        return new Promise(resolve => {
          image.onload = resolve;
          image.onerror = resolve;
        });
      }));

      elements.forEach(function(element) {

        const rect = element.getBoundingClientRect();
        const style = window.getComputedStyle(element);

        ctx.save();

        ctx.translate(
          rect.left + rect.width / 2,
          rect.top + rect.height / 2
        );

        const rotation = parseFloat(
          element.style.getPropertyValue("--rotation")
        ) || 0;

        ctx.rotate(rotation * Math.PI / 180);

        if (element.classList.contains("marko-image")) {

          if (element.complete && element.naturalWidth > 0) {
            ctx.drawImage(
              element,
              -rect.width / 2,
              -rect.height / 2,
              rect.width,
              rect.height
            );
          }

        } else {

          const text = element.textContent;
          const size = parseFloat(style.fontSize);
          const weight = style.fontWeight;
          const color = style.color;
          const fontStyle = style.fontStyle;

          ctx.font = `${fontStyle} ${weight} ${size}px "NationalCode"`;
          ctx.fillStyle = color;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          ctx.fillText(text, 0, 0);
        }

        ctx.restore();
      });

      const link = document.createElement("a");
      link.download = "MARKO-26.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    });

    // OPEN WISH PANEL

    document.getElementById("wish-button").addEventListener("click", function() {
      wishPanel.style.display = "flex";
      wishInput.focus();
    });

    // CLOSE WISH PANEL

    document.getElementById("close-wish").addEventListener("click", function() {
      wishPanel.style.display = "none";
      wishInput.value = "";
    });

    // RANDOM IMAGE FOR THANK YOU

    function showRandomImage() {
      const imageNumber = randomImageNumber();

      thankYouImage.style.backgroundImage =
        `url("${imageNumber}.png")`;
    }

    // SUBMIT WISH

    document.getElementById("submit-wish").addEventListener("click", function() {

      const wish = wishInput.value.trim();

      if (wish === "") {
        wishInput.focus();
        return;
      }

      wishPanel.style.display = "none";
      wishInput.value = "";

      resetCanvas();
      showRandomImage();

      thankYouScreen.style.display = "flex";
    });

    // CLICK THANK YOU SCREEN TO RETURN TO START

    thankYouScreen.addEventListener("click", function() {
      thankYouScreen.style.display = "none";
      resetCanvas();
    });

  </script>

</body>
</html>
