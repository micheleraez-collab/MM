
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MARKO — 26</title>

<style>
@font-face {
  font-family: "NationalCode";
  src: url("NationalCodePiStd-Universal.otf") format("opentype");
  font-weight: 100 1000;
  font-style: normal;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  color: black;
  font-family: "NationalCode", sans-serif;
}

body {
  cursor: crosshair;
}

/* LANDING PAGE */

#canvas-area {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 1;
  pointer-events: none;
}

.marko,
.marko-image {
  position: absolute;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
  will-change: left, top, transform;
}

.marko {
  white-space: nowrap;
  line-height: 0.9;
  transform-origin: center center;
}

.marko-image {
  object-fit: contain;
  transform-origin: center center;
}

/* BUTTONS */

.controls {
  position: fixed;
  left: 20px;
  bottom: 20px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

button {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 13px;
  font-weight: 600;
  background: white;
  color: black;
  border: 1px solid black;
  padding: 11px 16px;
  cursor: pointer;
}

button:hover {
  background: black;
  color: white;
}

#click-counter {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 10;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 13px;
  pointer-events: none;
}

/* WISH PANEL */

#wish-panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(255,255,255,0.97);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.wish-content {
  width: 100%;
  max-width: 500px;
}

.wish-content h2 {
  font-size: 42px;
  margin: 0 0 25px;
}

textarea {
  display: block;
  width: 100%;
  min-height: 150px;
  resize: vertical;
  padding: 15px;
  border: 1px solid black;
  border-radius: 0;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 16px;
  background: white;
  color: black;
  outline: none;
}

textarea:focus {
  border-width: 2px;
}

.wish-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 15px;
}

/* THANK YOU */

#thank-you-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: white;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 20px;
}

.thank-you-image {
  position: relative;
  width: min(650px, 80vw);
  height: min(450px, 60vh);
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
}

#thank-you-screen h1 {
  position: relative;
  font-size: clamp(50px, 12vw, 130px);
  line-height: 0.85;
  text-align: center;
  margin: 0;
  color: white;
  mix-blend-mode: difference;
  pointer-events: none;
}

/* =================================
   FULLSCREEN BEER MODE
================================= */

#beer-screen {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  z-index: 40;
  background: #fff;
  overflow: hidden;
  touch-action: none;
}

/* Photorealistic beer texture */

#beer-fill {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;

  background-image: url("beer-texture.png");
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;

  clip-path: polygon(
    0 0,
    100% 0,
    100% 100%,
    0 100%
  );

  will-change: clip-path;
}

/* Moving foam surface */

#beer-surface {
  position: absolute;
  left: -15%;
  width: 130%;
  height: 65px;
  top: 0;

  background:
    radial-gradient(
      ellipse at 15% 60%,
      rgba(255,255,255,0.98) 0%,
      rgba(255,250,237,0.96) 45%,
      rgba(240,224,197,0.75) 75%,
      rgba(255,255,255,0) 100%
    );

  border-radius: 50%;
  filter: blur(2px);
  pointer-events: none;
  will-change: top, transform;
  z-index: 3;
}

/* Fine foam texture */

#beer-surface::after {
  content: "";
  position: absolute;
  inset: 0;

  background-image:
    radial-gradient(circle at 12% 50%, rgba(255,255,255,0.9) 2px, transparent 4px),
    radial-gradient(circle at 28% 35%, rgba(210,180,140,0.18) 3px, transparent 5px),
    radial-gradient(circle at 50% 65%, rgba(255,255,255,0.8) 2px, transparent 4px),
    radial-gradient(circle at 73% 35%, rgba(210,180,140,0.15) 3px, transparent 5px),
    radial-gradient(circle at 90% 55%, rgba(255,255,255,0.9) 2px, transparent 4px);

  opacity: 0.8;
}

/* Marko photos inside the beer */

#beer-photos {
  position: absolute;
  inset: 0;
  z-index: 5;
  overflow: hidden;
  pointer-events: none;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
}

.beer-photo {
  position: absolute;
  object-fit: contain;
  filter: drop-shadow(0 4px 5px rgba(0,0,0,0.25));
  will-change: left, top, transform;
}

/* Bubbles */

#beer-bubbles {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
}

.beer-bubble {
  position: absolute;
  bottom: -10px;
  border: 1px solid rgba(255,255,255,0.65);
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  box-shadow: 0 0 4px rgba(255,255,255,0.4);
  animation: bubble-rise 3s infinite ease-in;
}

@keyframes bubble-rise {
  0% {
    transform: translateY(0);
    opacity: 0;
  }
  20% {
    opacity: 0.7;
  }
  100% {
    transform: translateY(-100vh);
    opacity: 0;
  }
}

/* Close button */

#beer-close {
  position: absolute;
  top: max(18px, env(safe-area-inset-top));
  right: 18px;
  z-index: 20;
  background: rgba(255,255,255,0.8);
  border: 1px solid rgba(0,0,0,0.3);
  color: black;
  font-size: 11px;
  padding: 9px 12px;
}

/* MOBILE */

@media (max-width: 600px) {
  .controls {
    left: 10px;
    bottom: max(12px, env(safe-area-inset-bottom));
    gap: 5px;
  }

  button {
    font-size: 11px;
    padding: 10px 9px;
  }

  #click-counter {
    right: 12px;
    bottom: max(17px, env(safe-area-inset-bottom));
    font-size: 12px;
  }

  .wish-content h2 {
    font-size: 34px;
  }

  .thank-you-image {
    width: 90vw;
    height: 55vh;
  }
}
</style>
</head>

<body>

<div id="canvas-area"></div>

<div class="controls">
  <button id="download-button">PNG DOWNLOAD ↓</button>
  <button id="beer-button">BEER</button>
  <button id="wish-button">ADD WISH +</button>
</div>

<div id="click-counter">0 / 10</div>

<!-- WISH PANEL -->

<div id="wish-panel">
  <div class="wish-content">
    <h2>MAKE A WISH</h2>

    <textarea
      id="wish-input"
      placeholder="Write your wish here..."
    ></textarea>

    <div class="wish-buttons">
      <button id="close-wish">CLOSE ×</button>
      <button id="submit-wish">SEND WISH ↑</button>
    </div>
  </div>
</div>

<!-- THANK YOU -->

<div id="thank-you-screen">
  <div class="thank-you-image" id="thank-you-image">
    <h1>THANK<br>YOU</h1>
  </div>
</div>

<!-- FULLSCREEN BEER -->

<div id="beer-screen">

  <button id="beer-close">CLOSE ×</button>

  <div id="beer-fill"></div>

  <div id="beer-bubbles"></div>

  <div id="beer-surface"></div>

  <div id="beer-photos"></div>

</div>

<script>

/* =================================
   ELEMENTS AND STATE
================================= */

const canvasArea = document.getElementById("canvas-area");
const counterDisplay = document.getElementById("click-counter");

const wishPanel = document.getElementById("wish-panel");
const wishInput = document.getElementById("wish-input");

const thankYouScreen = document.getElementById("thank-you-screen");
const thankYouImage = document.getElementById("thank-you-image");

const beerScreen = document.getElementById("beer-screen");
const beerFill = document.getElementById("beer-fill");
const beerSurface = document.getElementById("beer-surface");
const beerBubbles = document.getElementById("beer-bubbles");
const beerPhotos = document.getElementById("beer-photos");

let clickCount = 0;
let sensorsEnabled = false;
let beerMode = false;

let lastBeta = null;
let lastGamma = null;

let landingBaselineBeta = null;
let landingBaselineGamma = null;

let beerBaselineBeta = null;
let beerBaselineGamma = null;

let smoothBeta = 0;
let smoothGamma = 0;

let beerLevel = 100;
let lastFrameTime = 0;
let lastShake = 0;

const colors = [
  "#ff0000",
  "#0000ff",
  "#00a651",
  "#ff6600",
  "#ff00aa",
  "#8b00ff",
  "#000000",
  "#ffcc00",
  "#00a6a6"
];

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function randomImageNumber() {
  return Math.floor(Math.random() * 16) + 1;
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

/* =================================
   MOTION SENSORS
================================= */

async function enableSensors() {
  if (sensorsEnabled) return;

  try {
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      const permission =
        await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") return;
    }

    if ("DeviceOrientationEvent" in window) {
      window.addEventListener("deviceorientation", handleOrientation);
      sensorsEnabled = true;
    }

    if ("DeviceMotionEvent" in window) {
      window.addEventListener("devicemotion", handleMotion);
    }

  } catch (error) {
    console.log("Motion sensors unavailable:", error);
  }
}

function handleOrientation(event) {
  if (event.beta === null || event.gamma === null) return;

  lastBeta = event.beta;
  lastGamma = event.gamma;

  if (beerMode) {
    if (beerBaselineBeta === null) {
      beerBaselineBeta = lastBeta;
      beerBaselineGamma = lastGamma;
    }
  } else {
    if (landingBaselineBeta === null) {
      landingBaselineBeta = lastBeta;
      landingBaselineGamma = lastGamma;
    }
  }
}

/* =================================
   LANDING PAGE: CREATE ELEMENTS
================================= */

function createMarko() {

  if (Math.random() < 0.08) {
    createRandomImage();
    return;
  }

  const element = document.createElement("div");

  element.className = "marko";
  element.textContent = Math.random() < 0.5 ? "MARKO" : "26";

  const size = random(20, 150);
  const rotation = random(-35, 35);

  element.style.fontSize = size + "px";
  element.style.fontWeight = Math.floor(random(100, 1001));
  element.style.color =
    colors[Math.floor(Math.random() * colors.length)];
  element.style.fontStyle =
    Math.random() < 0.35 ? "italic" : "normal";

  const x = random(30, Math.max(31, window.innerWidth - 30));
  const y = random(30, Math.max(31, window.innerHeight - 30));

  element.dataset.x = x;
  element.dataset.y = y;
  element.dataset.vx = random(-0.3, 0.3);
  element.dataset.vy = random(-0.3, 0.3);
  element.dataset.rotation = rotation;
  element.dataset.spin = random(-0.25, 0.25);

  element.style.left = x + "px";
  element.style.top = y + "px";
  element.style.transform =
    `translate(-50%, -50%) rotate(${rotation}deg)`;

  canvasArea.appendChild(element);
}

function createRandomImage() {

  const image = document.createElement("img");

  image.className = "marko-image";
  image.src = `${randomImageNumber()}.png`;

  const size = random(50, 190);
  const rotation = random(-35, 35);

  const x = random(30, Math.max(31, window.innerWidth - 30));
  const y = random(30, Math.max(31, window.innerHeight - 30));

  image.style.width = size + "px";
  image.style.height = size + "px";

  image.dataset.x = x;
  image.dataset.y = y;
  image.dataset.vx = random(-0.3, 0.3);
  image.dataset.vy = random(-0.3, 0.3);
  image.dataset.rotation = rotation;
  image.dataset.spin = random(-0.25, 0.25);

  image.style.left = x + "px";
  image.style.top = y + "px";
  image.style.transform =
    `translate(-50%, -50%) rotate(${rotation}deg)`;

  canvasArea.appendChild(image);
}

/* =================================
   LANDING PAGE: PHYSICS
================================= */

function updateLandingPhysics(dt) {

  if (
    lastBeta === null ||
    lastGamma === null ||
    landingBaselineBeta === null ||
    landingBaselineGamma === null
  ) return;

  const tiltX = clamp(lastGamma - landingBaselineGamma, -60, 60);
  const tiltY = clamp(lastBeta - landingBaselineBeta, -60, 60);

  smoothGamma += (tiltX - smoothGamma) * 0.08;
  smoothBeta += (tiltY - smoothBeta) * 0.08;

  const elements = document.querySelectorAll(
    "#canvas-area .marko, #canvas-area .marko-image"
  );

  elements.forEach(element => {

    let x = parseFloat(element.dataset.x);
    let y = parseFloat(element.dataset.y);

    let vx = parseFloat(element.dataset.vx);
    let vy = parseFloat(element.dataset.vy);

    let rotation = parseFloat(element.dataset.rotation);
    let spin = parseFloat(element.dataset.spin);

    const rect = element.getBoundingClientRect();

    const halfWidth = rect.width / 2;
    const halfHeight = rect.height / 2;

    vx += smoothGamma * 0.00075 * dt * 60;
    vy += smoothBeta * 0.00075 * dt * 60;

    vx *= Math.pow(0.992, dt * 60);
    vy *= Math.pow(0.992, dt * 60);

    vx = clamp(vx, -8, 8);
    vy = clamp(vy, -8, 8);

    x += vx * dt * 60;
    y += vy * dt * 60;

    if (x < halfWidth) {
      x = halfWidth;
      vx = Math.abs(vx) * 0.72;
    }

    if (x > window.innerWidth - halfWidth) {
      x = window.innerWidth - halfWidth;
      vx = -Math.abs(vx) * 0.72;
    }

    if (y < halfHeight) {
      y = halfHeight;
      vy = Math.abs(vy) * 0.72;
    }

    if (y > window.innerHeight - halfHeight) {
      y = window.innerHeight - halfHeight;
      vy = -Math.abs(vy) * 0.72;
    }

    rotation += spin * dt * 60 + vx * 0.12;

    element.dataset.x = x;
    element.dataset.y = y;
    element.dataset.vx = vx;
    element.dataset.vy = vy;
    element.dataset.rotation = rotation;

    element.style.left = x + "px";
    element.style.top = y + "px";
    element.style.transform =
      `translate(-50%, -50%) rotate(${rotation}deg)`;

  });
}

/* =================================
   ANIMATION LOOP
================================= */

function animationLoop(timestamp) {

  if (!lastFrameTime) lastFrameTime = timestamp;

  const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.04);

  lastFrameTime = timestamp;

  if (beerMode) {
    updateBeerPhysics(dt);
  } else {
    updateLandingPhysics(dt);
  }

  requestAnimationFrame(animationLoop);
}

requestAnimationFrame(animationLoop);

/* =================================
   LANDING PAGE: CLICK
================================= */

document.addEventListener("click", async function(event) {

  if (
    event.target.closest("button") ||
    event.target.closest("#wish-panel") ||
    event.target.closest("#thank-you-screen") ||
    event.target.closest("#beer-screen")
  ) {
    return;
  }

  if (wishPanel.style.display === "flex") return;
  if (thankYouScreen.style.display === "flex") return;
  if (beerMode) return;

  await enableSensors();

  clickCount++;

  if (clickCount >= 10) {
    resetCanvas();
    return;
  }

  // Each click adds a new random amount
  const amount = Math.floor(random(3, 81));

  for (let i = 0; i < amount; i++) {
    createMarko();
  }

  updateCounter();
});

function updateCounter() {
  counterDisplay.textContent = clickCount + " / 10";
}

function resetCanvas() {
  canvasArea.innerHTML = "";
  clickCount = 0;
  updateCounter();
}

/* =================================
   SHAKE
================================= */

function handleMotion(event) {

  if (beerMode) return;

  const acceleration = event.accelerationIncludingGravity;
  if (!acceleration) return;

  const force =
    Math.abs(acceleration.x || 0) +
    Math.abs(acceleration.y || 0) +
    Math.abs(acceleration.z || 0);

  const now = Date.now();

  if (force > 35 && now - lastShake > 700) {

    lastShake = now;

    document.querySelectorAll(
      "#canvas-area .marko, #canvas-area .marko-image"
    ).forEach(element => {

      element.dataset.vx = random(-5, 5);
      element.dataset.vy = random(-5, 5);
      element.dataset.spin = random(-1, 1);

    });
  }
}

/* =================================
   PNG DOWNLOAD
================================= */

document.getElementById("download-button")
.addEventListener("click", async function() {

  await document.fonts.ready;

  const width = window.innerWidth;
  const height = window.innerHeight;
  const scale = 2;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = width * scale;
  canvas.height = height * scale;

  ctx.scale(scale, scale);

  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, width, height);

  const elements = document.querySelectorAll(
    "#canvas-area .marko, #canvas-area .marko-image"
  );

  const images = Array.from(
    document.querySelectorAll("#canvas-area .marko-image")
  );

  await Promise.all(images.map(image => {

    if (image.complete && image.naturalWidth > 0) {
      return Promise.resolve();
    }

    return new Promise(resolve => {
      image.onload = resolve;
      image.onerror = resolve;
    });

  }));

  elements.forEach(element => {

    const x = parseFloat(element.dataset.x);
    const y = parseFloat(element.dataset.y);
    const rotation = parseFloat(element.dataset.rotation);

    const rect = element.getBoundingClientRect();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation * Math.PI / 180);

    if (element.classList.contains("marko-image")) {

      if (element.complete && element.naturalWidth > 0) {
        ctx.drawImage(
          element,
          -rect.width / 2,
          -rect.height / 2,
          rect.width,
          rect.height
        );
      }

    } else {

      const style = window.getComputedStyle(element);
      const size = parseFloat(style.fontSize);

      ctx.font =
        `${style.fontStyle} ${style.fontWeight} ${size}px "NationalCode"`;

      ctx.fillStyle = style.color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(element.textContent, 0, 0);
    }

    ctx.restore();

  });

  const link = document.createElement("a");

  link.download = "MARKO-26.png";
  link.href = canvas.toDataURL("image/png");
  link.click();

});

/* =================================
   WISH PANEL
================================= */

document.getElementById("wish-button")
.addEventListener("click", function() {
  wishPanel.style.display = "flex";
  wishInput.focus();
});

document.getElementById("close-wish")
.addEventListener("click", function() {
  wishPanel.style.display = "none";
  wishInput.value = "";
});

function showRandomImage() {
  const imageNumber = randomImageNumber();
  thankYouImage.style.backgroundImage = `url("${imageNumber}.png")`;
}

document.getElementById("submit-wish")
.addEventListener("click", function() {

  if (wishInput.value.trim() === "") {
    wishInput.focus();
    return;
  }

  wishPanel.style.display = "none";
  wishInput.value = "";

  resetCanvas();
  showRandomImage();

  thankYouScreen.style.display = "flex";
});

thankYouScreen.addEventListener("click", function() {
  thankYouScreen.style.display = "none";
  resetCanvas();
});

/* =================================
   BEER MODE
================================= */

function openBeer() {

  beerMode = true;
  beerLevel = 100;

  beerBaselineBeta = lastBeta;
  beerBaselineGamma = lastGamma;

  smoothBeta = 0;
  smoothGamma = 0;

  beerFill.style.clipPath =
    "polygon(0 0, 100% 0, 100% 100%, 0 100%)";

  beerSurface.style.opacity = "1";
  beerPhotos.innerHTML = "";

  beerScreen.style.display = "block";

  createBeerBubbles();
}

/* OPEN BEER */

document.getElementById("beer-button")
.addEventListener("click", async function() {

  await enableSensors();
  openBeer();

});

/* TAP SCREEN = ADD MARKO PHOTOS */

beerScreen.addEventListener("click", function(event) {

  if (event.target.closest("#beer-close")) return;

  if (!beerMode) return;

  const amount = Math.floor(random(2, 5));

  for (let i = 0; i < amount; i++) {
    addBeerPhoto();
  }

});

/* ADD PHOTOS */

function addBeerPhoto() {

  const image = document.createElement("img");

  image.className = "beer-photo";
  image.src = `${randomImageNumber()}.png`;

  const size = random(55, 110);

  const x = random(size / 2, window.innerWidth - size / 2);
  const y = random(size / 2, window.innerHeight - size / 2);

  const rotation = random(-35, 35);

  image.dataset.x = x;
  image.dataset.y = y;
  image.dataset.vx = random(-0.5, 0.5);
  image.dataset.vy = random(-0.5, 0.5);
  image.dataset.rotation = rotation;
  image.dataset.spin = random(-0.4, 0.4);
  image.dataset.size = size;

  image.style.width = size + "px";
  image.style.height = size + "px";
  image.style.left = x + "px";
  image.style.top = y + "px";

  image.style.transform =
    `translate(-50%, -50%) rotate(${rotation}deg)`;

  beerPhotos.appendChild(image);
}

/* =================================
   BEER PHYSICS
================================= */

function updateBeerPhysics(dt) {

  if (
    lastBeta === null ||
    lastGamma === null ||
    beerBaselineBeta === null ||
    beerBaselineGamma === null
  ) return;

  const rawBeta = lastBeta - beerBaselineBeta;
  const rawGamma = lastGamma - beerBaselineGamma;

  // Smooth sensor readings
  smoothBeta += (rawBeta - smoothBeta) * 0.12;
  smoothGamma += (rawGamma - smoothGamma) * 0.12;

  const tiltX = clamp(smoothGamma, -90, 90);
  const tiltY = clamp(smoothBeta, -90, 90);

  // Beer surface angle
  const slope = clamp(tiltX * 0.45, -30, 30);

  // Drink when tilted
  const drinkingAngle = Math.max(0, Math.abs(tiltY) - 18);

  if (drinkingAngle > 0 && beerLevel > 0) {

    // More tilt = faster drinking
    const drinkingSpeed = drinkingAngle / 55;

    beerLevel = Math.max(
      0,
      beerLevel - drinkingSpeed * dt * 18
    );
  }

  // Calculate the moving liquid surface
  const surfaceY = 100 - beerLevel;

  const leftY = clamp(
    surfaceY + slope * 0.5,
    0,
    100
  );

  const rightY = clamp(
    surfaceY - slope * 0.5,
    0,
    100
  );

  // Crop the beer image to the remaining liquid
  beerFill.style.clipPath =
    `polygon(0 ${leftY}%, 100% ${rightY}%, 100% 100%, 0 100%)`;

  // Move the foam with the beer level
  beerSurface.style.top =
    `calc(${surfaceY}% - 32px)`;

  beerSurface.style.transform =
    `rotate(${slope}deg)`;

  beerSurface.style.opacity =
    beerLevel > 0.5 ? "1" : "0";

  // Photos follow the tilt with inertia
  const photos = document.querySelectorAll(".beer-photo");

  photos.forEach(photo => {

    let x = parseFloat(photo.dataset.x);
    let y = parseFloat(photo.dataset.y);

    let vx = parseFloat(photo.dataset.vx);
    let vy = parseFloat(photo.dataset.vy);

    let rotation = parseFloat(photo.dataset.rotation);
    let spin = parseFloat(photo.dataset.spin);

    const size = parseFloat(photo.dataset.size);
    const halfSize = size / 2;

    vx += tiltX * 0.0009;
    vy += tiltY * 0.0009;

    vx *= 0.985;
    vy *= 0.985;

    x += vx * 60 * dt;
    y += vy * 60 * dt;

    if (x < halfSize || x > window.innerWidth - halfSize) {
      vx *= -0.65;
      x = clamp(x, halfSize, window.innerWidth - halfSize);
    }

    if (y < halfSize || y > window.innerHeight - halfSize) {
      vy *= -0.65;
      y = clamp(y, halfSize, window.innerHeight - halfSize);
    }

    rotation += spin * dt * 60;

    photo.dataset.x = x;
    photo.dataset.y = y;
    photo.dataset.vx = vx;
    photo.dataset.vy = vy;
    photo.dataset.rotation = rotation;

    photo.style.left = x + "px";
    photo.style.top = y + "px";

    photo.style.transform =
      `translate(-50%, -50%) rotate(${rotation}deg)`;

  });
}

/* =================================
   BUBBLES
================================= */

function createBeerBubbles() {

  beerBubbles.innerHTML = "";

  for (let i = 0; i < 45; i++) {

    const bubble = document.createElement("div");

    bubble.className = "beer-bubble";

    const size = random(2, 6);

    bubble.style.width = size + "px";
    bubble.style.height = size + "px";
    bubble.style.left = random(0, 100) + "%";

    bubble.style.animationDelay = random(0, 5) + "s";
    bubble.style.animationDuration = random(2, 6) + "s";

    beerBubbles.appendChild(bubble);
  }
}

/* =================================
   CLOSE BEER
================================= */

document.getElementById("beer-close")
.addEventListener("click", function(event) {

  event.stopPropagation();

  beerMode = false;
  beerScreen.style.display = "none";

  beerBaselineBeta = null;
  beerBaselineGamma = null;

  smoothBeta = 0;
  smoothGamma = 0;

  // Recalibrate landing page to current phone position
  landingBaselineBeta = lastBeta;
  landingBaselineGamma = lastGamma;

});

</script>
