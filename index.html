
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>hottie</title>

<style>
@font-face {
  font-family: "NationalCode";
  src: url("NationalCodePiStd-Universal.otf") format("opentype");
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  font-family: Helvetica, Arial, sans-serif;
}

#canvas-area {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

.item {
  position: absolute;
  white-space: nowrap;
  font-family: "NationalCode", sans-serif;
  user-select: none;
  pointer-events: none;
  transform-origin: center;
}

.item img {
  display: block;
  width: auto;
  height: auto;
  max-width: min(42vw, 260px);
  max-height: min(42vh, 260px);
  object-fit: contain;
}

.controls {
  position: fixed;
  left: 16px;
  bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  z-index: 10;
}

button {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 11px;
  letter-spacing: .02em;
  padding: 10px 13px;
  border: 1px solid black;
  background: white;
  color: black;
  cursor: pointer;
}

#click-counter {
  position: fixed;
  right: 16px;
  bottom: 16px;
  font-size: 12px;
  z-index: 10;
}

#wish-panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: white;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

#wish-panel-inner {
  width: min(420px, 100%);
}

#wish-panel textarea {
  width: 100%;
  height: 130px;
  padding: 12px;
  border: 1px solid black;
  font: 14px Helvetica, Arial, sans-serif;
  resize: none;
}

#wish-panel button { margin-top: 10px; }

#thank-you-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 40;
  background: white;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#thank-you-screen img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

#thank-you-screen span {
  position: absolute;
  color: white;
  font-family: "NationalCode", sans-serif;
  font-size: clamp(50px, 14vw, 150px);
  pointer-events: none;
}

/* BEER */

#beer-screen {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  z-index: 50;
  overflow: hidden;
  background: #17100a;
  touch-action: none;
}

#beer-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#beer-photos {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.beer-photo {
  position: absolute;
  width: clamp(75px, 22vw, 145px);
  height: clamp(75px, 22vw, 145px);
  object-fit: cover;
  box-shadow: 0 3px 15px rgba(0,0,0,.3);
  will-change: transform;
}

#beer-close {
  position: absolute;
  right: 15px;
  top: 15px;
  z-index: 60;
  border: 1px solid rgba(255,255,255,.6);
  background: rgba(0,0,0,.2);
  color: white;
}
</style>
</head>

<body>

<div id="canvas-area"></div>

<div class="controls">
  <button id="download-button">PNG DOWNLOAD ↓</button>
  <button id="beer-button">BEER</button>
  <button id="wish-button">ADD WISH +</button>
</div>

<div id="click-counter">0 / 10</div>

<div id="wish-panel">
  <div id="wish-panel-inner">
    <textarea id="wish-text" placeholder="Your wish..."></textarea>
    <br>
    <button id="submit-wish">SEND WISH →</button>
    <button id="cancel-wish">CLOSE</button>
  </div>
</div>

<div id="thank-you-screen">
  <img id="thank-you-image" src="" alt="">
  <span>THANK YOU</span>
</div>

<div id="beer-screen">
  <canvas id="beer-canvas"></canvas>
  <div id="beer-photos"></div>
  <button id="beer-close">CLOSE</button>
</div>

<script>
/* ==================================================
   SETTINGS
================================================== */

const imageFiles = Array.from({length: 16}, (_, i) => `${i + 1}.png`);

const random = (min, max) => Math.random() * (max - min) + min;

const randomImage = () =>
  imageFiles[Math.floor(Math.random() * imageFiles.length)];

const colors = [
  "#000000", "#e52b24", "#2449d8",
  "#f1bd00", "#00a36c", "#a52bcb",
  "#ff5c35", "#6a3e2b"
];

/* ==================================================
   DEVICE MOTION
================================================== */

let sensorEnabled = false;
let tiltX = 0;
let tiltY = 0;

let targetTiltX = 0;
let targetTiltY = 0;

async function enableSensors() {
  if (sensorEnabled) return;

  if (
    typeof DeviceOrientationEvent !== "undefined" &&
    typeof DeviceOrientationEvent.requestPermission === "function"
  ) {
    try {
      const permission =
        await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") return;
    } catch (error) {
      console.log("Motion permission unavailable");
      return;
    }
  }

  window.addEventListener("deviceorientation", event => {
    if (event.beta == null || event.gamma == null) return;

    targetTiltX = Math.max(-1, Math.min(1, event.gamma / 35));
    targetTiltY = Math.max(-1, Math.min(1, event.beta / 60));
  }, true);

  sensorEnabled = true;
}

function smoothSensors() {
  tiltX += (targetTiltX - tiltX) * .09;
  tiltY += (targetTiltY - tiltY) * .09;
  requestAnimationFrame(smoothSensors);
}

smoothSensors();

/* ==================================================
   LANDING PAGE – RANDOM COMPOSITION
================================================== */

const canvasArea = document.getElementById("canvas-area");
const counter = document.getElementById("click-counter");

let items = [];
let clickCount = 0;

function createItem() {
  const element = document.createElement("div");
  element.className = "item";

  const isImage = Math.random() < .12;

  if (isImage) {
    const img = document.createElement("img");
    img.src = randomImage();
    element.appendChild(img);
  } else {
    element.textContent = Math.random() < .5 ? "MARKO" : "26";

    element.style.fontSize = `${random(13, 150)}px`;
    element.style.color =
      colors[Math.floor(Math.random() * colors.length)];

    element.style.fontWeight =
      Math.random() < .5 ? "normal" : "bold";

    element.style.fontStyle =
      Math.random() < .22 ? "italic" : "normal";

    element.style.letterSpacing = `${random(-5, 8)}px`;
  }

  /*
    Deliberately uneven distribution:
    some objects gather in clusters,
    others appear far away.
  */

  let x, y;

  if (Math.random() < .65 && items.length > 0) {
    const anchor = items[Math.floor(Math.random() * items.length)];

    x = anchor.x + random(-180, 180);
    y = anchor.y + random(-160, 160);
  } else {
    x = random(-80, window.innerWidth - 40);
    y = random(-70, window.innerHeight - 40);
  }

  const rotation = random(-75, 75);

  element.style.left = `${x}px`;
  element.style.top = `${y}px`;
  element.style.transform = `rotate(${rotation}deg)`;

  canvasArea.appendChild(element);

  items.push({
    element,
    x,
    y,
    vx: random(-2.8, 2.8),
    vy: random(-2.8, 2.8),
    rotation,
    rotationSpeed: random(-.7, .7)
  });
}

function createComposition() {
  clickCount++;

  if (clickCount >= 10) {
    canvasArea.innerHTML = "";
    items = [];
    clickCount = 0;
  } else {
    /*
      Weighted random amount:
      usually a lot of elements,
      sometimes very few,
      sometimes an overwhelming amount.
    */

    const roll = Math.random();
    let amount;

    if (roll < .15) amount = Math.floor(random(3, 12));
    else if (roll < .45) amount = Math.floor(random(12, 30));
    else if (roll < .8) amount = Math.floor(random(30, 65));
    else amount = Math.floor(random(65, 110));

    for (let i = 0; i < amount; i++) {
      createItem();
    }
  }

  counter.textContent = `${clickCount} / 10`;
}

canvasArea.addEventListener("click", () => {
  enableSensors();
  createComposition();
});

/* ==================================================
   LANDING PAGE MOVEMENT
================================================== */

function animateItems() {
  const width = window.innerWidth;
  const height = window.innerHeight;

  items.forEach(item => {
    item.vx += tiltX * .15;
    item.vy += tiltY * .15;

    item.vx *= .985;
    item.vy *= .985;

    item.x += item.vx;
    item.y += item.vy;
    item.rotation += item.rotationSpeed;

    const rect = item.element.getBoundingClientRect();

    if (item.x > width - rect.width || item.x < -rect.width) {
      item.vx *= -.75;
    }

    if (item.y > height - rect.height || item.y < -rect.height) {
      item.vy *= -.75;
    }

    item.element.style.left = `${item.x}px`;
    item.element.style.top = `${item.y}px`;
    item.element.style.transform = `rotate(${item.rotation}deg)`;
  });

  requestAnimationFrame(animateItems);
}

animateItems();

/* ==================================================
   PNG EXPORT
================================================== */

document.getElementById("download-button")
.addEventListener("click", async () => {
  const width = window.innerWidth;
  const height = window.innerHeight;

  const output = document.createElement("canvas");
  const ctx = output.getContext("2d");

  output.width = width * 2;
  output.height = height * 2;
  ctx.scale(2, 2);

  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, width, height);

  for (const item of items) {
    const rect = item.element.getBoundingClientRect();
    const img = item.element.querySelector("img");

    if (img) {
      try {
        await img.decode();
        ctx.save();
        ctx.translate(rect.left + rect.width / 2, rect.top + rect.height / 2);
        ctx.rotate(item.rotation * Math.PI / 180);
        ctx.drawImage(
          img,
          -rect.width / 2,
          -rect.height / 2,
          rect.width,
          rect.height
        );
        ctx.restore();
      } catch (error) {}
    } else {
      const style = getComputedStyle(item.element);

      ctx.save();
      ctx.translate(rect.left, rect.top);
      ctx.rotate(item.rotation * Math.PI / 180);
      ctx.fillStyle = style.color;
      ctx.font =
        `${style.fontStyle} ${style.fontWeight} ${style.fontSize} NationalCode`;
      ctx.fillText(item.element.textContent, 0, rect.height * .8);
      ctx.restore();
    }
  }

  const link = document.createElement("a");
  link.download = "marko-26.png";
  link.href = output.toDataURL("image/png");
  link.click();
});

/* ==================================================
   WISH
================================================== */

const wishPanel = document.getElementById("wish-panel");
const wishText = document.getElementById("wish-text");
const thankYouScreen = document.getElementById("thank-you-screen");

document.getElementById("wish-button").onclick = () => {
  wishPanel.style.display = "flex";
  wishText.value = "";
};

document.getElementById("cancel-wish").onclick = () => {
  wishPanel.style.display = "none";
};

document.getElementById("submit-wish").onclick = () => {
  if (!wishText.value.trim()) return;

  wishPanel.style.display = "none";
  canvasArea.innerHTML = "";
  items = [];
  clickCount = 0;
  counter.textContent = "0 / 10";

  document.getElementById("thank-you-image").src = randomImage();
  thankYouScreen.style.display = "flex";
};

thankYouScreen.onclick = () => {
  thankYouScreen.style.display = "none";
};

/* ==================================================
   BEER MODE
================================================== */

const beerScreen = document.getElementById("beer-screen");
const beerCanvas = document.getElementById("beer-canvas");
const ctx = beerCanvas.getContext("2d");
const beerPhotos = document.getElementById("beer-photos");

let beerLevel = .94;
let beerAngle = 0;
let beerAngleVelocity = 0;
let beerSlosh = 0;
let beerSloshVelocity = 0;
let beerLastTime = 0;
let beerRunning = false;
let beerPhotoItems = [];

function resizeBeer() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  beerCanvas.width = window.innerWidth * dpr;
  beerCanvas.height = window.innerHeight * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeBeer);

function openBeer() {
  enableSensors();

  beerScreen.style.display = "block";
  canvasArea.style.display = "none";
  document.querySelector(".controls").style.display = "none";
  counter.style.display = "none";

  beerPhotos.innerHTML = "";
  beerPhotoItems = [];

  beerLevel = .94;
  beerAngle = 0;
  beerAngleVelocity = 0;
  beerSlosh = 0;
  beerSloshVelocity = 0;

  resizeBeer();

  beerRunning = true;
  beerLastTime = performance.now();

  requestAnimationFrame(animateBeer);
}

function closeBeer() {
  beerRunning = false;
  beerScreen.style.display = "none";
  canvasArea.style.display = "block";
  document.querySelector(".controls").style.display = "flex";
  counter.style.display = "block";
}

document.getElementById("beer-button").onclick = openBeer;
document.getElementById("beer-close").onclick = closeBeer;

/* Photos */

beerScreen.addEventListener("pointerdown", event => {
  if (event.target.id === "beer-close") return;

  const amount = Math.floor(random(2, 5));

  for (let i = 0; i < amount; i++) {
    const img = document.createElement("img");
    img.className = "beer-photo";
    img.src = randomImage();

    const size = random(75, 135);
    img.style.width = `${size}px`;
    img.style.height = `${size}px`;

    beerPhotos.appendChild(img);

    beerPhotoItems.push({
      element: img,
      x: random(0, window.innerWidth - size),
      y: random(0, window.innerHeight - size),
      vx: random(-2, 2),
      vy: random(-2, 2),
      size,
      rotation: random(-25, 25),
      spin: random(-.5, .5)
    });
  }
});

/* Beer photos movement */

function updatePhotos(dt) {
  const w = window.innerWidth;
  const h = window.innerHeight;

  beerPhotoItems.forEach(photo => {
    photo.vx += tiltX * 18 * dt;
    photo.vy += tiltY * 18 * dt;

    photo.vx *= Math.pow(.985, dt * 60);
    photo.vy *= Math.pow(.985, dt * 60);

    photo.x += photo.vx * dt * 60;
    photo.y += photo.vy * dt * 60;
    photo.rotation += photo.spin * dt * 60;

    if (photo.x < 0) {
      photo.x = 0;
      photo.vx *= -.8;
    }

    if (photo.x + photo.size > w) {
      photo.x = w - photo.size;
      photo.vx *= -.8;
    }

    if (photo.y < 0) {
      photo.y = 0;
      photo.vy *= -.8;
    }

    if (photo.y + photo.size > h) {
      photo.y = h - photo.size;
      photo.vy *= -.8;
    }

    photo.element.style.left = "0";
    photo.element.style.top = "0";
    photo.element.style.transform =
      `translate(${photo.x}px, ${photo.y}px) rotate(${photo.rotation}deg)`;
  });
}

/* Fluid physics */

function updateBeerPhysics(dt) {
  /*
    Liquid follows the phone's orientation.
    It has inertia, so it does not instantly snap
    into the new position.
  */

  const targetAngle = Math.atan2(-tiltX, tiltY || .001);

  beerAngleVelocity += (targetAngle - beerAngle) * 3.5 * dt;
  beerAngleVelocity *= Math.pow(.86, dt * 60);
  beerAngle += beerAngleVelocity * dt * 60;

  beerAngle = Math.max(-1.05, Math.min(1.05, beerAngle));

  /*
    Secondary slosh: a little overshoot and wobble
    after every movement.
  */

  beerSloshVelocity += (tiltX * .5 - beerSlosh) * 2.5 * dt;
  beerSloshVelocity *= Math.pow(.92, dt * 60);
  beerSlosh += beerSloshVelocity * dt * 60;

  /*
    Drink only when tipping the phone in one direction.
    Reverse the sign if the direction is wrong.
  */

  const betaDegrees = tiltY * 60;
  const drinking = Math.max(0, betaDegrees - 24);

  if (drinking > 0 && beerLevel > .01) {
    beerLevel -= drinking * .000018 * dt * 60;
    beerLevel = Math.max(.01, beerLevel);
  }
}

/* Surface shape */

function surfaceY(x, time, width, height) {
  const centerX = width / 2;
  const baseY = height * (1 - beerLevel);
  const slope = Math.tan(beerAngle);

  const movement =
    Math.sin(x * .009 + time * .0015) * beerSlosh * 13;

  const wave =
    Math.sin(x * .018 + time * .0018) * 2.5 +
    Math.sin(x * .038 - time * .0012) * 1.3 +
    Math.sin(x * .006 + time * .0008) * 3;

  return baseY + (x - centerX) * slope + movement + wave;
}

/* Draw liquid */

function drawBeer(time) {
  const w = window.innerWidth;
  const h = window.innerHeight;

  ctx.clearRect(0, 0, w, h);

  /*
    Dark background gives the impression of a screen
    filled with beer rather than a glass object.
  */

  ctx.fillStyle = "#160d07";
  ctx.fillRect(0, 0, w, h);

  const points = [];

  for (let x = -10; x <= w + 10; x += 3) {
    points.push({
      x,
      y: surfaceY(x, time, w, h)
    });
  }

  /* Beer body */

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, h);
  ctx.lineTo(0, points[0].y);

  points.forEach(p => ctx.lineTo(p.x, p.y));

  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.clip();

  const liquid = ctx.createLinearGradient(0, 0, w * .6, h);

  liquid.addColorStop(0, "#f8c45d");
  liquid.addColorStop(.18, "#e99b26");
  liquid.addColorStop(.42, "#ce7914");
  liquid.addColorStop(.72, "#a9530b");
  liquid.addColorStop(1, "#612a08");

  ctx.fillStyle = liquid;
  ctx.fillRect(0, 0, w, h);

  /* Warm light inside the beer */

  const glow = ctx.createRadialGradient(
    w * .3, h * .45, 5,
    w * .3, h * .45, w * .85
  );

  glow.addColorStop(0, "rgba(255,224,142,.35)");
  glow.addColorStop(.45, "rgba(255,174,48,.12)");
  glow.addColorStop(1, "rgba(40,12,0,.35)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);

  /* Tiny suspended bubbles */

  for (let i = 0; i < 160; i++) {
    const x = (i * 97.31) % w;
    const y = (i * 173.13 - time * (.018 + (i % 5) * .004)) % h;

    if (y < 0) continue;

    const r = .5 + (i % 4) * .45;

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,232,170,.3)";
    ctx.fill();
  }

  ctx.restore();

  /* Foam cap with soft irregular edge */

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(w, 0);

  for (let i = points.length - 1; i >= 0; i--) {
    const p = points[i];
    ctx.lineTo(p.x, p.y);
  }

  ctx.closePath();

  const foam = ctx.createLinearGradient(0, 0, 0, 65);
  foam.addColorStop(0, "#fffdf5");
  foam.addColorStop(.5, "#f9f0dc");
  foam.addColorStop(1, "#e5d3b2");

  ctx.fillStyle = foam;
  ctx.fill();

  /*
    Small foam pockets and bubbles make the edge
    less geometric and more organic.
  */

  for (let i = 0; i < 260; i++) {
    const x = (i * 37.71) % w;
    const y = surfaceY(x, time, w, h) + random(-7, 7);
    const r = random(1, 3.8);

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle =
      i % 3 === 0
        ? "rgba(255,255,255,.9)"
        : "rgba(221,197,158,.45)";
    ctx.fill();
  }

  /* Soft shadow where foam meets beer */

  ctx.beginPath();

  points.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y + 5);
    else ctx.lineTo(p.x, p.y + 5);
  });

  ctx.strokeStyle = "rgba(73,35,9,.25)";
  ctx.lineWidth = 7;
  ctx.filter = "blur(5px)";
  ctx.stroke();
  ctx.filter = "none";

  ctx.restore();

  /* Small highlights */

  ctx.save();
  ctx.globalCompositeOperation = "screen";

  const highlight = ctx.createLinearGradient(0, 0, w, h);
  highlight.addColorStop(0, "rgba(255,255,255,.09)");
  highlight.addColorStop(.35, "rgba(255,255,255,0)");
  highlight.addColorStop(1, "rgba(255,255,255,.04)");

  ctx.fillStyle = highlight;
  ctx.fillRect(0, 0, w, h);

  ctx.restore();
}

/* Main animation */

function animateBeer(time) {
  if (!beerRunning) return;

  const dt = Math.min((time - beerLastTime) / 1000, .04);
  beerLastTime = time;

  updateBeerPhysics(dt);
  drawBeer(time);
  updatePhotos(dt);

  requestAnimationFrame(animateBeer);
}

/* ==================================================
   INITIALISE
================================================== */

document.addEventListener("pointerdown", () => {
  enableSensors();
}, {once: true});

</script>
</body>
</html>
