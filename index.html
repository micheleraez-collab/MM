
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPY BIRTHDAY</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Helvetica, Arial, sans-serif;
}

.birthday {
  position: relative;
  text-align: center;
  z-index: 2;
}

h1 {
  position: relative;
  font-family: Helvetica, Arial, sans-serif;
  font-size: clamp(60px, 13vw, 190px);
  font-weight: 900;
  letter-spacing: -0.085em;
  line-height: 0.78;
  color: #ff4b00;
  text-transform: uppercase;

  text-shadow:
    0 0 2px #fff2a0,
    0 -3px 8px #ffbb00,
    0 -8px 18px #ff7800,
    0 -15px 35px #ff3300;

  animation: flicker 0.13s infinite alternate;
}

@keyframes flicker {
  0% {
    filter: brightness(1);
    text-shadow:
      0 0 3px #fff000,
      0 -5px 10px #ffb000,
      0 -12px 25px #ff6000,
      0 -20px 40px #ff2600;
  }

  100% {
    filter: brightness(1.3);
    text-shadow:
      0 0 5px #fff8a0,
      0 -8px 15px #ffca00,
      0 -18px 32px #ff7000,
      0 -30px 50px #ff2000;
  }
}

/* FLAMES */

.flames {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

.flame {
  position: absolute;
  width: var(--width);
  height: var(--height);
  left: var(--left);
  top: var(--top);

  background: linear-gradient(
    to top,
    #ff2600 0%,
    #ff7000 35%,
    #ffca00 65%,
    #fff5a0 85%,
    transparent 100%
  );

  border-radius: 50% 50% 20% 20%;
  filter: blur(3px);
  transform-origin: bottom center;

  animation: burn var(--duration) ease-in-out infinite alternate;
  animation-delay: var(--delay);
}

@keyframes burn {
  0% {
    transform: scaleY(0.6) scaleX(0.8) rotate(-12deg);
    opacity: 0.5;
  }

  50% {
    transform: scaleY(1.2) scaleX(1.1) rotate(8deg);
    opacity: 1;
  }

  100% {
    transform: scaleY(0.8) scaleX(0.7) rotate(-5deg);
    opacity: 0.7;
  }
}

/* MOBILE */

@media (max-width: 600px) {
  h1 {
    font-size: 17vw;
  }
}
</style>
</head>

<body>

<div class="flames" id="flames"></div>

<div class="birthday">
  <h1>HAPPY<br>BIRTHDAY</h1>
</div>

<script>
const flames = document.getElementById("flames");

function createFlames() {
  flames.innerHTML = "";

  for (let i = 0; i < 90; i++) {
    const flame = document.createElement("div");
    flame.classList.add("flame");

    flame.style.setProperty(
      "--width", (4 + Math.random() * 13) + "px"
    );

    flame.style.setProperty(
      "--height", (15 + Math.random() * 45) + "px"
    );

    flame.style.setProperty(
      "--left", Math.random() * 100 + "%"
    );

    flame.style.setProperty(
      "--top", (20 + Math.random() * 65) + "%"
    );

    flame.style.setProperty(
      "--duration", (0.2 + Math.random() * 0.6) + "s"
    );

    flame.style.setProperty(
      "--delay", Math.random() + "s"
    );

    flames.appendChild(flame);
  }
}

createFlames();
</script>

</body>
</html>
