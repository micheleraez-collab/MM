
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>hottie</title>

<style>
@font-face {
  font-family: "NationalCode";
  src: url("NationalCodePiStd-Universal.otf") format("opentype");
  font-weight: 100 1000;
  font-style: normal;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  color: black;
  font-family: "NationalCode", sans-serif;
}

body {
  cursor: crosshair;
}

/* LANDING PAGE */

#canvas-area {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 1;
  pointer-events: none;
}

.marko,
.marko-image {
  position: absolute;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
  will-change: left, top, transform;
}

.marko {
  white-space: nowrap;
  line-height: 0.9;
  transform-origin: center center;
}

.marko-image {
  object-fit: contain;
  transform-origin: center center;
}

/* BUTTONS */

.controls {
  position: fixed;
  left: 20px;
  bottom: 20px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

button {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 13px;
  font-weight: 600;
  background: white;
  color: black;
  border: 1px solid black;
  padding: 11px 16px;
  cursor: pointer;
}

button:hover {
  background: black;
  color: white;
}

#click-counter {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 10;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 13px;
  pointer-events: none;
}

/* WISH PANEL */

#wish-panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(255,255,255,0.97);
  align-items: center;
  justify-content: center;
  padding: 20px;
  cursor: default;
}

.wish-content {
  width: 100%;
  max-width: 500px;
}

.wish-content h2 {
  font-size: 42px;
  margin: 0 0 25px;
}

textarea {
  display: block;
  width: 100%;
  min-height: 150px;
  resize: vertical;
  padding: 15px;
  border: 1px solid black;
  border-radius: 0;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 16px;
  background: white;
  color: black;
  outline: none;
}

textarea:focus {
  border-width: 2px;
}

.wish-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 15px;
}

/* THANK YOU */

#thank-you-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: white;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 20px;
}

.thank-you-image {
  position: relative;
  width: min(650px, 80vw);
  height: min(450px, 60vh);
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
}

#thank-you-screen h1 {
  position: relative;
  font-size: clamp(50px, 12vw, 130px);
  line-height: 0.85;
  text-align: center;
  margin: 0;
  color: white;
  mix-blend-mode: difference;
  pointer-events: none;
}

/* =================================
   BEER MODE
================================= */

#beer-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 40;
  background: #fff;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: default;
  touch-action: manipulation;
}

#beer-glass {
  position: relative;
  width: min(65vw, 310px);
  height: min(57vh, 470px);
  margin-top: 0;
  border: 2px solid rgba(80,80,80,0.25);
  border-top: 2px solid rgba(80,80,80,0.4);
  border-radius: 13px 13px 42px 42px;
  background: linear-gradient(
    90deg,
    rgba(255,255,255,0.75),
    rgba(255,255,255,0.08) 20%,
    rgba(255,255,255,0.08) 80%,
    rgba(255,255,255,0.75)
  );
  box-shadow:
    0 15px 40px rgba(0,0,0,0.08),
    inset 5px 0 10px rgba(255,255,255,0.8),
    inset -5px 0 10px rgba(255,255,255,0.8);
  transform-origin: center center;
  transition: none;
  overflow: hidden;
  touch-action: manipulation;
}

#beer-content {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 9px 9px 38px 38px;
}

#beer-liquid {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 85%;
  background: linear-gradient(
    90deg,
    #9c4900 0%,
    #d97900 12%,
    #f9a900 32%,
    #ffd04a 48%,
    #f2a000 72%,
    #a94c00 100%
  );
  box-shadow:
    inset 0 10px 18px rgba(255,255,255,0.24),
    inset 0 -10px 18px rgba(100,40,0,0.2);
  transition: height 0.12s linear;
  z-index: 1;
}

#beer-surface {
  position: absolute;
  left: -20%;
  top: -13px;
  width: 140%;
  height: 27px;
  border-radius: 50%;
  background: linear-gradient(180deg, #ffe69a, #ffbf36);
  box-shadow: 0 4px 12px rgba(255,230,160,0.35);
}

#beer-foam {
  position: absolute;
  left: -5%;
  top: -27px;
  width: 110%;
  height: 52px;
  border-radius: 50%;
  background: radial-gradient(
    ellipse at 30% 45%,
    #fffdf2 0%,
    #fff1d2 65%,
    #e9d3a7 100%
  );
  box-shadow:
    0 4px 12px rgba(255,255,255,0.5),
    inset 0 -6px 8px rgba(180,140,80,0.15);
  transition: opacity 0.3s;
}

#beer-bubbles {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.beer-bubble {
  position: absolute;
  bottom: -10px;
  width: 4px;
  height: 4px;
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  animation: beer-bubble-rise 3s infinite ease-in;
}

@keyframes beer-bubble-rise {
  from {
    transform: translateY(0);
    opacity: 0;
  }
  20% {
    opacity: 0.65;
  }
  to {
    transform: translateY(-450px);
    opacity: 0;
  }
}

/* MARKO PHOTOS IN GLASS */

#marko-photos {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 3;
}

.beer-photo {
  position: absolute;
  object-fit: contain;
  filter: drop-shadow(0 4px 5px rgba(0,0,0,0.28));
  will-change: left, top, transform;
}

/* GLASS DETAILS */

.glass-shine {
  position: absolute;
  top: 5%;
  left: 7%;
  width: 13px;
  height: 82%;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  filter: blur(4px);
  pointer-events: none;
  z-index: 5;
}

.glass-rim {
  position: absolute;
  top: 0;
  left: -2px;
  right: -2px;
  height: 9px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.8);
  box-shadow: 0 2px 10px rgba(255,255,255,0.25);
  pointer-events: none;
  z-index: 6;
}

.glass-base {
  position: absolute;
  bottom: 0;
  left: 10%;
  width: 80%;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.24);
  pointer-events: none;
  z-index: 6;
}

#beer-glass::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  opacity: 0.55;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.7) 1px, transparent 2px),
    radial-gradient(circle at 88% 25%, rgba(255,255,255,.5) 2px, transparent 3px),
    radial-gradient(circle at 18% 65%, rgba(255,255,255,.45) 2px, transparent 3px),
    radial-gradient(circle at 83% 73%, rgba(255,255,255,.6) 1px, transparent 2px),
    radial-gradient(circle at 92% 48%, rgba(255,255,255,.4) 1px, transparent 2px),
    radial-gradient(circle at 8% 83%, rgba(255,255,255,.5) 2px, transparent 3px);
}

#beer-close {
  position: absolute;
  top: 20px;
  right: 20px;
  color: black;
  background: white;
  border-color: black;
  z-index: 10;
}

/* MOBILE */

@media (max-width: 600px) {
  .controls {
    left: 10px;
    bottom: 12px;
    gap: 5px;
  }

  button {
    font-size: 11px;
    padding: 10px 9px;
  }

  #click-counter {
    right: 12px;
    bottom: 17px;
    font-size: 12px;
  }

  .wish-content h2 {
    font-size: 34px;
  }

  .thank-you-image {
    width: 90vw;
    height: 55vh;
  }

  #beer-glass {
    width: 70vw;
    height: 52vh;
  }
}
</style>
</head>

<body>

<div id="canvas-area"></div>

<div class="controls">
  <button id="download-button">PNG DOWNLOAD ↓</button>
  <button id="beer-button">BEER</button>
  <button id="wish-button">ADD WISH +</button>
</div>

<div id="click-counter">0 / 10</div>

<!-- WISH PANEL -->

<div id="wish-panel">
  <div class="wish-content">
    <h2>MAKE A WISH</h2>

    <textarea
      id="wish-input"
      placeholder="Write your wish here..."
    ></textarea>

    <div class="wish-buttons">
      <button id="close-wish">CLOSE ×</button>
      <button id="submit-wish">SEND WISH ↑</button>
    </div>
  </div>
</div>

<!-- THANK YOU -->

<div id="thank-you-screen">
  <div class="thank-you-image" id="thank-you-image">
    <h1>THANK<br>YOU</h1>
  </div>
</div>

<!-- BEER -->

<div id="beer-screen">
  <button id="beer-close">CLOSE ×</button>

  <div id="beer-glass">
    <div id="beer-content">
      <div id="beer-liquid">
        <div id="beer-bubbles"></div>
        <div id="beer-surface"></div>
        <div id="beer-foam"></div>
      </div>
      <div id="marko-photos"></div>
    </div>

    <div class="glass-shine"></div>
    <div class="glass-rim"></div>
    <div class="glass-base"></div>
  </div>
</div>

<script>

/* =================================
   ELEMENTS AND STATE
================================= */

const canvasArea = document.getElementById("canvas-area");
const counterDisplay = document.getElementById("click-counter");

const wishPanel = document.getElementById("wish-panel");
const wishInput = document.getElementById("wish-input");

const thankYouScreen = document.getElementById("thank-you-screen");
const thankYouImage = document.getElementById("thank-you-image");

const beerScreen = document.getElementById("beer-screen");
const beerGlass = document.getElementById("beer-glass");
const beerLiquid = document.getElementById("beer-liquid");
const beerSurface = document.getElementById("beer-surface");
const beerFoam = document.getElementById("beer-foam");
const beerBubbles = document.getElementById("beer-bubbles");
const markoPhotos = document.getElementById("marko-photos");

let clickCount = 0;
let sensorsEnabled = false;
let beerMode = false;

let lastBeta = null;
let lastGamma = null;

let smoothBeta = 0;
let smoothGamma = 0;

let landingBaselineBeta = null;
let landingBaselineGamma = null;

let beerBaselineBeta = null;
let beerBaselineGamma = null;

let beerLevel = 85;
let lastFrameTime = 0;
let lastShake = 0;

const colors = [
  "#ff0000",
  "#0000ff",
  "#00a651",
  "#ff6600",
  "#ff00aa",
  "#8b00ff",
  "#000000",
  "#ffcc00",
  "#00a6a6"
];

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function randomImageNumber() {
  return Math.floor(Math.random() * 16) + 1;
}

/* =================================
   MOTION SENSORS
================================= */

async function enableSensors() {
  if (sensorsEnabled) return;

  try {
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      const permission =
        await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") return;
    }

    if ("DeviceOrientationEvent" in window) {
      window.addEventListener("deviceorientation", handleOrientation);
      sensorsEnabled = true;
    }

    if ("DeviceMotionEvent" in window) {
      window.addEventListener("devicemotion", handleMotion);
    }

  } catch (error) {
    console.log("Motion sensors unavailable:", error);
  }
}

function handleOrientation(event) {
  if (event.beta === null || event.gamma === null) return;

  lastBeta = event.beta;
  lastGamma = event.gamma;

  if (beerMode) {
    if (beerBaselineBeta === null) {
      beerBaselineBeta = lastBeta;
      beerBaselineGamma = lastGamma;
    }
  } else {
    if (landingBaselineBeta === null) {
      landingBaselineBeta = lastBeta;
      landingBaselineGamma = lastGamma;
    }
  }
}

/* =================================
   LANDING PAGE: CREATE ELEMENTS
================================= */

function createMarko() {

  if (Math.random() < 0.08) {
    createRandomImage();
    return;
  }

  const element = document.createElement("div");

  element.className = "marko";
  element.textContent = Math.random() < 0.5 ? "MARKO" : "26";

  const size = random(20, 150);
  const rotation = random(-35, 35);

  element.style.fontSize = size + "px";
  element.style.fontWeight = Math.floor(random(100, 1001));
  element.style.color = colors[Math.floor(Math.random() * colors.length)];
  element.style.fontStyle = Math.random() < 0.35 ? "italic" : "normal";

  const x = random(30, Math.max(31, window.innerWidth - 30));
  const y = random(30, Math.max(31, window.innerHeight - 30));

  element.dataset.x = x;
  element.dataset.y = y;
  element.dataset.vx = random(-0.3, 0.3);
  element.dataset.vy = random(-0.3, 0.3);
  element.dataset.rotation = rotation;
  element.dataset.spin = random(-0.25, 0.25);

  element.style.left = x + "px";
  element.style.top = y + "px";
  element.style.transform =
    `translate(-50%, -50%) rotate(${rotation}deg)`;

  canvasArea.appendChild(element);
  element.dataset.ready = "true";
}

function createRandomImage() {

  const image = document.createElement("img");

  image.className = "marko-image";
  image.src = `${randomImageNumber()}.png`;

  const size = random(50, 190);
  const rotation = random(-35, 35);

  const x = random(30, Math.max(31, window.innerWidth - 30));
  const y = random(30, Math.max(31, window.innerHeight - 30));

  image.style.width = size + "px";
  image.style.height = size + "px";

  image.dataset.x = x;
  image.dataset.y = y;
  image.dataset.vx = random(-0.3, 0.3);
  image.dataset.vy = random(-0.3, 0.3);
  image.dataset.rotation = rotation;
  image.dataset.spin = random(-0.25, 0.25);

  image.style.left = x + "px";
  image.style.top = y + "px";
  image.style.transform =
    `translate(-50%, -50%) rotate(${rotation}deg)`;

  canvasArea.appendChild(image);
}

/* =================================
   LANDING PAGE: PHYSICS
================================= */

function updateLandingPhysics(dt) {

  if (lastBeta === null || lastGamma === null) return;

  const tiltX = Math.max(
    -60,
    Math.min(60, lastGamma - landingBaselineGamma)
  );

  const tiltY = Math.max(
    -60,
    Math.min(60, lastBeta - landingBaselineBeta)
  );

  // Smooth sensor movement
  smoothGamma += (tiltX - smoothGamma) * 0.08;
  smoothBeta += (tiltY - smoothBeta) * 0.08;

  const elements = document.querySelectorAll(
    "#canvas-area .marko, #canvas-area .marko-image"
  );

  elements.forEach(element => {

    let x = parseFloat(element.dataset.x);
    let y = parseFloat(element.dataset.y);

    let vx = parseFloat(element.dataset.vx);
    let vy = parseFloat(element.dataset.vy);

    let rotation = parseFloat(element.dataset.rotation);
    let spin = parseFloat(element.dataset.spin);

    const rect = element.getBoundingClientRect();

    const width = rect.width || 80;
    const height = rect.height || 80;

    const halfWidth = width / 2;
    const halfHeight = height / 2;

    // Tilt acts like gravity
    vx += smoothGamma * 0.00075 * dt * 60;
    vy += smoothBeta * 0.00075 * dt * 60;

    // Small natural friction
    vx *= Math.pow(0.992, dt * 60);
    vy *= Math.pow(0.992, dt * 60);

    // Limit speed
    const maxSpeed = 8;
    vx = Math.max(-maxSpeed, Math.min(maxSpeed, vx));
    vy = Math.max(-maxSpeed, Math.min(maxSpeed, vy));

    // Move
    x += vx * dt * 60;
    y += vy * dt * 60;

    // Bounce on screen edges
    if (x < halfWidth) {
      x = halfWidth;
      vx = Math.abs(vx) * 0.72;
    }

    if (x > window.innerWidth - halfWidth) {
      x = window.innerWidth - halfWidth;
      vx = -Math.abs(vx) * 0.72;
    }

    if (y < halfHeight) {
      y = halfHeight;
      vy = Math.abs(vy) * 0.72;
    }

    if (y > window.innerHeight - halfHeight) {
      y = window.innerHeight - halfHeight;
      vy = -Math.abs(vy) * 0.72;
    }

    // Roll and rotate as the elements move
    rotation += spin * dt * 60 + vx * 0.12;

    element.dataset.x = x;
    element.dataset.y = y;
    element.dataset.vx = vx;
    element.dataset.vy = vy;
    element.dataset.rotation = rotation;

    element.style.left = x + "px";
    element.style.top = y + "px";
    element.style.transform =
      `translate(-50%, -50%) rotate(${rotation}deg)`;

  });
}

/* =================================
   ANIMATION LOOP
================================= */

function animationLoop(timestamp) {

  if (!lastFrameTime) lastFrameTime = timestamp;

  const dt = Math.min((timestamp - lastFrameTime) / 1000, 0.04);

  lastFrameTime = timestamp;

  if (!beerMode) {
    updateLandingPhysics(dt);
  } else {
    updateBeerPhysics(dt);
  }

  requestAnimationFrame(animationLoop);
}

requestAnimationFrame(animationLoop);

/* =================================
   LANDING PAGE: CLICK
================================= */

document.addEventListener("click", async function(event) {

  if (
    event.target.closest("button") ||
    event.target.closest("#wish-panel") ||
    event.target.closest("#thank-you-screen") ||
    event.target.closest("#beer-screen")
  ) {
    return;
  }

  if (wishPanel.style.display === "flex") return;
  if (thankYouScreen.style.display === "flex") return;
  if (beerMode) return;

  await enableSensors();

  clickCount++;

  if (clickCount >= 10) {
    resetCanvas();
    return;
  }

  const amount = Math.floor(random(15, 61));

  for (let i = 0; i < amount; i++) {
    createMarko();
  }

  updateCounter();
});

function updateCounter() {
  counterDisplay.textContent = clickCount + " / 10";
}

function resetCanvas() {
  canvasArea.innerHTML = "";
  clickCount = 0;
  updateCounter();
}

/* =================================
   SHAKE
================================= */

function handleMotion(event) {

  if (beerMode) return;

  const acceleration = event.accelerationIncludingGravity;
  if (!acceleration) return;

  const force =
    Math.abs(acceleration.x || 0) +
    Math.abs(acceleration.y || 0) +
    Math.abs(acceleration.z || 0);

  const now = Date.now();

  if (force > 35 && now - lastShake > 700) {

    lastShake = now;

    document.querySelectorAll("#canvas-area .marko, #canvas-area .marko-image")
      .forEach(element => {

        element.dataset.vx = random(-5, 5);
        element.dataset.vy = random(-5, 5);
        element.dataset.spin = random(-1, 1);

      });
  }
}

/* =================================
   PNG DOWNLOAD
================================= */

document.getElementById("download-button").addEventListener("click", async function() {

  await document.fonts.ready;

  const width = window.innerWidth;
  const height = window.innerHeight;
  const scale = 2;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = width * scale;
  canvas.height = height * scale;

  ctx.scale(scale, scale);

  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, width, height);

  const elements = document.querySelectorAll(
    "#canvas-area .marko, #canvas-area .marko-image"
  );

  const images = Array.from(
    document.querySelectorAll("#canvas-area .marko-image")
  );

  await Promise.all(images.map(image => {

    if (image.complete && image.naturalWidth > 0) {
      return Promise.resolve();
    }

    return new Promise(resolve => {
      image.onload = resolve;
      image.onerror = resolve;
    });

  }));

  elements.forEach(element => {

    const x = parseFloat(element.dataset.x);
    const y = parseFloat(element.dataset.y);
    const rotation = parseFloat(element.dataset.rotation);

    const rect = element.getBoundingClientRect();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation * Math.PI / 180);

    if (element.classList.contains("marko-image")) {

      if (element.complete && element.naturalWidth > 0) {
        ctx.drawImage(
          element,
          -rect.width / 2,
          -rect.height / 2,
          rect.width,
          rect.height
        );
      }

    } else {

      const style = window.getComputedStyle(element);
      const size = parseFloat(style.fontSize);

      ctx.font =
        `${style.fontStyle} ${style.fontWeight} ${size}px "NationalCode"`;

      ctx.fillStyle = style.color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(element.textContent, 0, 0);

    }

    ctx.restore();

  });

  const link = document.createElement("a");

  link.download = "MARKO-26.png";
  link.href = canvas.toDataURL("image/png");
  link.click();

});

/* =================================
   WISH PANEL
================================= */

document.getElementById("wish-button").addEventListener("click", function() {
  wishPanel.style.display = "flex";
  wishInput.focus();
});

document.getElementById("close-wish").addEventListener("click", function() {
  wishPanel.style.display = "none";
  wishInput.value = "";
});

function showRandomImage() {
  const imageNumber = randomImageNumber();
  thankYouImage.style.backgroundImage = `url("${imageNumber}.png")`;
}

document.getElementById("submit-wish").addEventListener("click", function() {

  if (wishInput.value.trim() === "") {
    wishInput.focus();
    return;
  }

  wishPanel.style.display = "none";
  wishInput.value = "";

  resetCanvas();
  showRandomImage();

  thankYouScreen.style.display = "flex";

});

thankYouScreen.addEventListener("click", function() {
  thankYouScreen.style.display = "none";
  resetCanvas();
});

/* =================================
   BEER MODE
================================= */

function openBeer() {

  beerMode = true;
  beerLevel = 85;

  beerBaselineBeta = lastBeta;
  beerBaselineGamma = lastGamma;

  beerLiquid.style.height = "85%";
  beerFoam.style.opacity = "1";

  markoPhotos.innerHTML = "";

  beerGlass.style.opacity = "1";
  beerGlass.style.transform = "rotate(0deg)";

  beerScreen.style.display = "flex";

  createBeerBubbles();

}

/* OPEN BEER */

document.getElementById("beer-button").addEventListener("click", async function() {
  await enableSensors();
  openBeer();
});

/* TAP GLASS = ADD PHOTOS */

beerGlass.addEventListener("click", function(event) {

  event.stopPropagation();

  if (!beerMode) return;

  const amount = Math.floor(random(2, 5));

  for (let i = 0; i < amount; i++) {
    addBeerPhoto();
  }

});

/* ADD PHOTO */

function addBeerPhoto() {

  const image = document.createElement("img");

  image.className = "beer-photo";
  image.src = `${randomImageNumber()}.png`;

  const size = random(45, 95);

  const width = markoPhotos.clientWidth;
  const height = markoPhotos.clientHeight;

  const x = random(size / 2, Math.max(size / 2, width - size / 2));
  const y = random(size / 2, Math.max(size / 2, height - size / 2));

  const rotation = random(-35, 35);

  image.dataset.x = x;
  image.dataset.y = y;
  image.dataset.vx = random(-0.5, 0.5);
  image.dataset.vy = random(-0.5, 0.5);
  image.dataset.rotation = rotation;
  image.dataset.spin = random(-0.4, 0.4);
  image.dataset.size = size;

  image.style.width = size + "px";
  image.style.height = size + "px";
  image.style.left = x + "px";
  image.style.top = y + "px";

  image.style.transform =
    `translate(-50%, -50%) rotate(${rotation}deg)`;

  markoPhotos.appendChild(image);

}

/* BEER PHYSICS */

function updateBeerPhysics(dt) {

  if (lastBeta === null || lastGamma === null) return;

  if (beerBaselineBeta === null || beerBaselineGamma === null) {
    beerBaselineBeta = lastBeta;
    beerBaselineGamma = lastGamma;
    return;
  }

  const rawBeta = lastBeta - beerBaselineBeta;
  const rawGamma = lastGamma - beerBaselineGamma;

  smoothBeta += (rawBeta - smoothBeta) * 0.10;
  smoothGamma += (rawGamma - smoothGamma) * 0.10;

  const tiltX = Math.max(-90, Math.min(90, smoothGamma));
  const tiltY = Math.max(-90, Math.min(90, smoothBeta));

  // Glass tilt
  beerGlass.style.transform =
    `rotate(${tiltX * 0.22}deg)`;

  // Beer surface reacts to tilt
  beerSurface.style.transform =
    `translate(${tiltX * 0.5}px, ${tiltY * 0.15}px) rotate(${-tiltX * 0.7}deg)`;

  // Drink when the phone is tilted sufficiently
  const drinkingAngle = Math.max(0, Math.abs(tiltY) - 42);

  if (drinkingAngle > 0 && beerLevel > 0) {

    const drinkingSpeed = drinkingAngle / 48;

    beerLevel = Math.max(
      0,
      beerLevel - drinkingSpeed * dt * 13
    );

    beerLiquid.style.height = beerLevel + "%";
    beerFoam.style.opacity = Math.max(0, beerLevel / 85);

  }

  // Move photos inside glass
  const photos = document.querySelectorAll(".beer-photo");

  const width = markoPhotos.clientWidth;
  const height = markoPhotos.clientHeight;

  photos.forEach(photo => {

    let x = parseFloat(photo.dataset.x);
    let y = parseFloat(photo.dataset.y);

    let vx = parseFloat(photo.dataset.vx);
    let vy = parseFloat(photo.dataset.vy);

    let rotation = parseFloat(photo.dataset.rotation);
    let spin = parseFloat(photo.dataset.spin);

    const size = parseFloat(photo.dataset.size);
    const halfSize = size / 2;

    vx += tiltX * 0.0009;
    vy += tiltY * 0.0009;

    vx *= 0.985;
    vy *= 0.985;

    x += vx * 60 * dt;
    y += vy * 60 * dt;

    if (x < halfSize || x > width - halfSize) {
      vx *= -0.65;
      x = Math.max(halfSize, Math.min(width - halfSize, x));
    }

    if (y < halfSize || y > height - halfSize) {
      vy *= -0.65;
      y = Math.max(halfSize, Math.min(height - halfSize, y));
    }

    rotation += spin * dt * 60;

    photo.dataset.x = x;
    photo.dataset.y = y;
    photo.dataset.vx = vx;
    photo.dataset.vy = vy;
    photo.dataset.rotation = rotation;

    photo.style.left = x + "px";
    photo.style.top = y + "px";

    photo.style.transform =
      `translate(-50%, -50%) rotate(${rotation}deg)`;

  });

}

/* BUBBLES */

function createBeerBubbles() {

  beerBubbles.innerHTML = "";

  for (let i = 0; i < 25; i++) {

    const bubble = document.createElement("div");

    bubble.className = "beer-bubble";
    bubble.style.left = random(5, 95) + "%";
    bubble.style.animationDelay = random(0, 4) + "s";
    bubble.style.animationDuration = random(2, 5) + "s";

    beerBubbles.appendChild(bubble);

  }

}

/* CLOSE BEER */

document.getElementById("beer-close").addEventListener("click", function(event) {

  event.stopPropagation();

  beerMode = false;
  beerScreen.style.display = "none";

  beerGlass.style.transform = "none";

  beerBaselineBeta = null;
  beerBaselineGamma = null;

  smoothBeta = 0;
  smoothGamma = 0;

  landingBaselineBeta = lastBeta;
  landingBaselineGamma = lastGamma;

});

</script>
