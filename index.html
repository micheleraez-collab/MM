<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MARKO 26</title>

<style>
@font-face {
  font-family: "National";
  src: url("NationalCodePiStd-Universal.otf") format("opentype");
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  color: black;
  font-family: Helvetica, Arial, sans-serif;
}

button {
  font: inherit;
  cursor: pointer;
}

#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: white;
}

.item {
  position: absolute;
  transform-origin: center;
  white-space: nowrap;
  user-select: none;
  pointer-events: none;
  line-height: .85;
}

.item img {
  display: block;
  width: 100%;
  height: auto;
}

#controls {
  position: fixed;
  z-index: 20;
  bottom: 20px;
  left: 20px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.ui-button {
  background: white;
  color: black;
  border: 1px solid black;
  border-radius: 30px;
  padding: 10px 16px;
  font-size: 12px;
  letter-spacing: .02em;
}

.ui-button:hover {
  background: black;
  color: white;
}

#counter {
  position: fixed;
  right: 20px;
  bottom: 24px;
  z-index: 20;
  font-size: 12px;
}

/* GENERAL SCREENS */

.screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  background: white;
}

.screen.active { display: block; }

/* WISH INPUT */

#wish-screen {
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

#wish-screen.active { display: flex; }

#wish-panel {
  width: min(420px, 100%);
  text-align: center;
}

#wish-panel h2 {
  font-size: 24px;
  font-weight: 400;
  margin: 0 0 24px;
}

#wish-input {
  width: 100%;
  border: 0;
  border-bottom: 1px solid black;
  border-radius: 0;
  padding: 12px 4px;
  font: inherit;
  font-size: 18px;
  outline: none;
  text-align: center;
  background: transparent;
}

#wish-submit {
  margin-top: 24px;
}

/* WISH LAUNCH SCREEN */

#thank-you {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 60;
  background: white;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  user-select: none;
}

#thank-you.active {
  display: flex;
}

#throw-instruction {
  position: absolute;
  top: 42px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 10px;
  letter-spacing: .12em;
  font-weight: 400;
}

#your-wish {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 13px;
  font-weight: 400;
  letter-spacing: .02em;
  white-space: nowrap;
  cursor: grab;
  touch-action: none;
  user-select: none;
  will-change: transform, opacity;
}

#your-wish.launching {
  pointer-events: none;
  animation: wish-launch .85s cubic-bezier(.15,.75,.25,1) forwards;
}

@keyframes wish-launch {
  0% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
  25% {
    transform: translate(-50%, -58%) scale(1.08);
    opacity: 1;
  }
  100% {
    transform: translate(-50%, -160vh) scale(.35);
    opacity: 0;
  }
}

/* THANK YOU AFTER LAUNCH */

#wish-thank-you {
  display: none;
  position: absolute;
  inset: 0;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  background: white;
  cursor: pointer;
  animation: thank-you-appear .7s ease both;
}

#wish-thank-you.show {
  display: flex;
}

#wish-thank-you-image {
  width: 130px;
  height: auto;
  max-height: 180px;
  object-fit: contain;
  margin-bottom: 24px;
}

#wish-thank-you div {
  font-size: 28px;
  font-weight: 400;
}

#wish-thank-you p {
  font-size: 12px;
  font-weight: 400;
  margin-top: 12px;
}

@keyframes thank-you-appear {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* HANGMAN */

#hangman-screen {
  overflow-y: auto;
  padding: 30px 20px 60px;
  text-align: center;
}

#hangman-close {
  position: fixed;
  top: 18px;
  right: 20px;
  z-index: 10;
}

.hangman-content {
  position: relative;
  z-index: 2;
  width: min(600px, 100%);
  margin: 45px auto 0;
}

#hangman-drawing {
  width: 180px;
  height: 180px;
  margin: 0 auto 20px;
  overflow: visible;
}

.hm-part {
  display: none;
  fill: none;
  stroke: black;
  stroke-width: 3;
  stroke-linecap: round;
}

#hangman-word {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: center;
  gap: 9px;
  margin: 25px 0;
  color: black;
}

.hm-letter {
  width: 34px;
  min-width: 34px;
  height: 42px;
  border-bottom: 2px solid black;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 27px;
  font-weight: bold;
  line-height: 1;
}

#hangman-letters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
  max-width: 420px;
  margin: 30px auto;
}

.letter-button {
  width: 36px;
  height: 36px;
  border: 1px solid black;
  background: white;
  border-radius: 50%;
  font-size: 13px;
}

.letter-button:disabled {
  opacity: .2;
  cursor: default;
}

#hangman-message {
  min-height: 30px;
  font-size: 14px;
  margin: 20px 0;
}

#win-images {
  position: fixed;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
}

.win-image {
  position: absolute;
  width: 100px;
  height: auto;
  opacity: 0;
  animation: pop-in .45s ease forwards;
}

@keyframes pop-in {
  0% {
    opacity: 0;
    transform: scale(.1) rotate(var(--rotation));
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(var(--rotation));
  }
}

#you-won {
  display: none;
  position: fixed;
  z-index: 5;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: red;
  font-family: Helvetica, Arial, sans-serif;
  font-size: clamp(40px, 12vw, 110px);
  font-weight: 900;
  white-space: nowrap;
  pointer-events: none;
  animation: blink .5s steps(2, start) infinite;
}

@keyframes blink {
  to { visibility: hidden; }
}

/* BEER */

#beer-screen {
  background: #d99a32;
  overflow: hidden;
  touch-action: none;
}

#beer-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#beer-photos {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.beer-photo {
  position: absolute;
  width: 90px;
  height: auto;
  transform-origin: center;
}

#beer-close {
  position: fixed;
  z-index: 10;
  top: 18px;
  right: 20px;
}
</style>
</head>

<body>

<div id="stage"></div>

<div id="controls">
  <button class="ui-button" id="gift-button">GESCHENK</button>
  <button class="ui-button" id="beer-button">BEER</button>
  <button class="ui-button" id="wish-button">ADD WISH +</button>
</div>

<div id="counter">0 / 10</div>

<!-- WISH INPUT -->
<div id="wish-screen" class="screen">
  <div id="wish-panel">
    <h2>MAKE A WISH</h2>
    <input id="wish-input" type="text" placeholder="Your wish..." maxlength="120">
    <br>
    <button class="ui-button" id="wish-submit">SEND WISH</button>
    <br><br>
    <button class="ui-button" id="wish-close">CLOSE</button>
  </div>
</div>

<!-- WISH LAUNCH AND THANK YOU -->
<div id="thank-you">
  <div id="throw-instruction">THROW IT INTO THE UNIVERSE</div>
  <div id="your-wish">YOUR WISH</div>

  <div id="wish-thank-you">
    <img id="wish-thank-you-image" src="1.png" alt="">
    <div>THANK YOU!</div>
    <p>Your wish will soon come true.</p>
  </div>
</div>

<!-- HANGMAN -->
<div id="hangman-screen" class="screen">
  <button class="ui-button" id="hangman-close">CLOSE</button>

  <div id="win-images"></div>
  <div id="you-won">WIN WIN WIN</div>

  <div class="hangman-content">
    <svg id="hangman-drawing" viewBox="0 0 180 180">

      <path class="hm-part" id="hm-1" d="M25 165 H155"/>
      <path class="hm-part" id="hm-2" d="M55 165 V15 H120 V35"/>

      <defs>
        <clipPath id="headClip">
          <circle cx="120" cy="52" r="17"/>
        </clipPath>
      </defs>

      <image
        id="hm-head-photo"
        x="103"
        y="35"
        width="34"
        height="34"
        preserveAspectRatio="xMidYMid slice"
        clip-path="url(#headClip)"
        style="display:none;"
      />

      <path class="hm-part" id="hm-4" d="M120 69 V112"/>
      <path class="hm-part" id="hm-5" d="M120 80 L95 100"/>
      <path class="hm-part" id="hm-6" d="M120 80 L145 100"/>

    </svg>

    <div id="hangman-word"></div>
    <div id="hangman-letters"></div>
    <div id="hangman-message"></div>
  </div>
</div>

<!-- BEER -->
<div id="beer-screen" class="screen">
  <canvas id="beer-canvas"></canvas>
  <div id="beer-photos"></div>
  <button class="ui-button" id="beer-close">CLOSE</button>
</div>

<script>

/* SHARED SETTINGS */

const stage = document.getElementById("stage");
const counter = document.getElementById("counter");

const imageFiles = Array.from(
  { length: 16 },
  (_, i) => `${i + 1}.png`
);

let clickCount = 0;
let rawBeta = null;
let rawGamma = null;
let tiltX = 0;
let tiltY = 0;
let sensorsStarted = false;

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function randomItem(array) {
  return array[Math.floor(Math.random() * array.length)];
}

/* DEVICE TILT */

async function enableSensors() {
  if (sensorsStarted) return;

  if (
    typeof DeviceOrientationEvent !== "undefined" &&
    typeof DeviceOrientationEvent.requestPermission === "function"
  ) {
    try {
      const permission = await DeviceOrientationEvent.requestPermission();
      if (permission !== "granted") return;
    } catch (error) {
      console.log("Sensor permission:", error);
      return;
    }
  }

  window.addEventListener("deviceorientation", (event) => {
    if (event.beta !== null) rawBeta = event.beta;
    if (event.gamma !== null) rawGamma = event.gamma;

    const beta = event.beta || 0;
    const gamma = event.gamma || 0;

    tiltX += (gamma / 45 - tiltX) * 0.08;
    tiltY += (beta / 45 - tiltY) * 0.08;
  });

  sensorsStarted = true;
}

document.addEventListener("pointerdown", enableSensors, { once: true });

/* RANDOM LANDING PAGE */

function createLandingItem() {
  const isImage = Math.random() < 0.12;
  const element = document.createElement("div");

  element.className = "item";

  const x = random(-5, window.innerWidth - 30);
  const y = random(-5, window.innerHeight - 30);
  const rotation = random(-65, 65);

  if (isImage) {
    const img = document.createElement("img");
    img.src = randomItem(imageFiles);
    img.alt = "";

    element.appendChild(img);
    element.style.width = `${random(35, 220)}px`;
  } else {
    element.textContent = Math.random() < 0.5 ? "MARKO" : "26";
    element.style.fontFamily = "National, Helvetica, sans-serif";
    element.style.fontSize = `${random(18, 150)}px`;
    element.style.fontWeight = randomItem(["400", "600", "800"]);

    element.style.color = randomItem([
      "#000000",
      "#ed1c24",
      "#2445ff",
      "#00a651",
      "#ff6b00",
      "#a000c8",
      "#ff1493"
    ]);
  }

  element.style.left = `${x}px`;
  element.style.top = `${y}px`;

  element.dataset.x = x;
  element.dataset.y = y;
  element.dataset.rotation = rotation;

  element.style.transform = `rotate(${rotation}deg)`;

  stage.appendChild(element);
}

function generateComposition() {
  clickCount++;
  stage.innerHTML = "";

  if (clickCount >= 10) {
    clickCount = 0;
  }

  let amount;
  const chance = Math.random();

  if (chance < 0.15) {
    amount = Math.floor(random(3, 12));
  } else if (chance < 0.45) {
    amount = Math.floor(random(12, 30));
  } else if (chance < 0.80) {
    amount = Math.floor(random(30, 65));
  } else {
    amount = Math.floor(random(65, 110));
  }

  for (let i = 0; i < amount; i++) {
    createLandingItem();
  }

  counter.textContent = `${clickCount} / 10`;
}

stage.addEventListener("click", generateComposition);

function animateLanding() {
  document.querySelectorAll("#stage .item").forEach((item) => {
    const x = Number(item.dataset.x);
    const y = Number(item.dataset.y);
    const rotation = Number(item.dataset.rotation);

    item.style.left = `${x + tiltX * 35}px`;
    item.style.top = `${y + tiltY * 35}px`;
    item.style.transform = `rotate(${rotation + tiltX * 2}deg)`;
  });

  requestAnimationFrame(animateLanding);
}

animateLanding();

/* WISH */

const wishScreen = document.getElementById("wish-screen");
const wishLaunchScreen = document.getElementById("thank-you");
const wishInput = document.getElementById("wish-input");
const yourWish = document.getElementById("your-wish");
const wishThankYou = document.getElementById("wish-thank-you");
const throwInstruction = document.getElementById("throw-instruction");

let wishStartY = 0;
let wishStartTime = 0;
let wishPointerDown = false;
let wishHasLaunched = false;
let wishThankYouVisible = false;

document.getElementById("wish-button").addEventListener("click", () => {
  wishScreen.classList.add("active");
  wishInput.value = "";
  wishInput.focus();
});

document.getElementById("wish-close").addEventListener("click", () => {
  wishScreen.classList.remove("active");
});

document.getElementById("wish-submit").addEventListener("click", () => {
  if (!wishInput.value.trim()) {
    wishInput.focus();
    return;
  }

  wishScreen.classList.remove("active");

  stage.innerHTML = "";
  clickCount = 0;
  counter.textContent = "0 / 10";

  /* Reset the wish experience */
  wishHasLaunched = false;
  wishThankYouVisible = false;
  wishPointerDown = false;

  yourWish.classList.remove("launching");
  yourWish.style.display = "block";

  throwInstruction.style.display = "block";
  wishThankYou.classList.remove("show");

  wishLaunchScreen.classList.add("active");
});

/* Launch the wish */

function launchWish() {
  if (wishHasLaunched || wishThankYouVisible) return;

  wishHasLaunched = true;
  yourWish.classList.add("launching");

  setTimeout(() => {
    yourWish.style.display = "none";
    throwInstruction.style.display = "none";

    document.getElementById("wish-thank-you-image").src = randomItem(imageFiles);
    wishThankYou.classList.add("show");
    wishThankYouVisible = true;
  }, 850);
}

/* Tap or swipe up on YOUR WISH */

yourWish.addEventListener("pointerdown", (event) => {
  if (wishHasLaunched) return;

  event.preventDefault();
  event.stopPropagation();

  wishPointerDown = true;
  wishStartY = event.clientY;
  wishStartTime = Date.now();

  yourWish.setPointerCapture(event.pointerId);
});

yourWish.addEventListener("pointerup", (event) => {
  event.preventDefault();
  event.stopPropagation();

  if (!wishPointerDown || wishHasLaunched) return;

  wishPointerDown = false;

  const distance = wishStartY - event.clientY;
  const elapsed = Date.now() - wishStartTime;
  const speed = distance / Math.max(elapsed, 1);

  /* A tap or a quick upward swipe launches it */
  if (distance < 12 || (distance > 35 && speed > 0.25)) {
    launchWish();
  }
});

yourWish.addEventListener("pointercancel", () => {
  wishPointerDown = false;
});

/* Tap the thank-you message to return home */

wishThankYou.addEventListener("click", () => {
  if (!wishThankYouVisible) return;

  wishLaunchScreen.classList.remove("active");

  wishThankYou.classList.remove("show");
  yourWish.classList.remove("launching");

  yourWish.style.display = "block";
  throwInstruction.style.display = "block";

  wishHasLaunched = false;
  wishThankYouVisible = false;
});

/* HANGMAN */

const solution = "FREITAG";
const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

const hangmanScreen = document.getElementById("hangman-screen");
const hangmanWord = document.getElementById("hangman-word");
const hangmanLetters = document.getElementById("hangman-letters");
const hangmanMessage = document.getElementById("hangman-message");
const winImages = document.getElementById("win-images");
const youWon = document.getElementById("you-won");
const headPhoto = document.getElementById("hm-head-photo");

let guessedLetters = [];
let mistakes = 0;
let gameFinished = false;

function renderWord() {
  hangmanWord.innerHTML = "";

  for (let i = 0; i < solution.length; i++) {
    const letter = solution[i];
    const span = document.createElement("div");

    span.className = "hm-letter";
    span.textContent = guessedLetters.includes(letter)
      ? letter
      : "\u00A0";

    hangmanWord.appendChild(span);
  }
}

function renderLetters() {
  hangmanLetters.innerHTML = "";

  alphabet.forEach((letter) => {
    const button = document.createElement("button");

    button.className = "letter-button";
    button.textContent = letter;
    button.disabled = guessedLetters.includes(letter) || gameFinished;

    button.addEventListener("click", () => {
      guessLetter(letter);
    });

    hangmanLetters.appendChild(button);
  });
}

function renderDrawing() {
  for (let i = 1; i <= 6; i++) {
    if (i === 3) continue;

    document.getElementById(`hm-${i}`).style.display =
      i <= mistakes ? "block" : "none";
  }

  headPhoto.style.display = mistakes >= 3 ? "block" : "none";
}

function guessLetter(letter) {
  if (gameFinished || guessedLetters.includes(letter)) return;

  guessedLetters.push(letter);

  if (!solution.includes(letter)) {
    mistakes++;
  }

  renderWord();
  renderLetters();
  renderDrawing();

  if (
    solution.split("").every((character) =>
      guessedLetters.includes(character)
    )
  ) {
    finishHangman(true);
    return;
  }

  if (mistakes >= 6) {
    finishHangman(false);
  }
}

function finishHangman(won) {
  gameFinished = true;
  renderLetters();

  if (won) {
    hangmanMessage.textContent = "";
    youWon.style.display = "block";
    showWinImages();
  } else {
    hangmanMessage.textContent =
      "GAME OVER – DAS WORT WAR FREITAG.";
  }
}

function showWinImages() {
  winImages.innerHTML = "";

  for (let i = 0; i < 60; i++) {
    const img = document.createElement("img");

    img.className = "win-image";
    img.src = randomItem(imageFiles);
    img.alt = "";

    img.style.left = `${random(-2, 95)}%`;
    img.style.top = `${random(-2, 95)}%`;
    img.style.width = `${random(35, 160)}px`;
    img.style.setProperty(
      "--rotation",
      `${random(-50, 50)}deg`
    );
    img.style.animationDelay = `${random(0, 2)}s`;

    winImages.appendChild(img);
  }
}

function resetHangman() {
  guessedLetters = [];
  mistakes = 0;
  gameFinished = false;

  hangmanMessage.textContent = "";
  winImages.innerHTML = "";
  youWon.style.display = "none";

  headPhoto.setAttribute("href", randomItem(imageFiles));
  headPhoto.style.display = "none";

  renderWord();
  renderLetters();
  renderDrawing();
}

document.getElementById("gift-button").addEventListener("click", () => {
  hangmanScreen.classList.add("active");
  resetHangman();
});

document.getElementById("hangman-close").addEventListener("click", () => {
  hangmanScreen.classList.remove("active");
});

/* BEER MODE */

const beerScreen = document.getElementById("beer-screen");
const beerCanvas = document.getElementById("beer-canvas");
const beerCtx = beerCanvas.getContext("2d");
const beerPhotos = document.getElementById("beer-photos");

let beerLevel = 0.72;
let beerBaseBeta = null;
let beerBaseGamma = null;
let beerLastTime = 0;
let beerAnimationStarted = false;
let beerSurfaceOffset = 0;

function resizeBeerCanvas() {
  const dpr = window.devicePixelRatio || 1;

  beerCanvas.width = window.innerWidth * dpr;
  beerCanvas.height = window.innerHeight * dpr;

  beerCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeBeerCanvas);

function openBeer() {
  enableSensors();

  beerScreen.classList.add("active");

  beerBaseBeta = rawBeta;
  beerBaseGamma = rawGamma;
  beerLevel = 0.72;
  beerPhotos.innerHTML = "";

  resizeBeerCanvas();

  if (!beerAnimationStarted) {
    beerAnimationStarted = true;
    requestAnimationFrame(drawBeer);
  }
}

document.getElementById("beer-button").addEventListener("click", openBeer);

document.getElementById("beer-close").addEventListener("click", () => {
  beerScreen.classList.remove("active");
});

function addBeerPhotos() {
  for (let i = 0; i < Math.floor(random(2, 5)); i++) {
    const img = document.createElement("img");

    img.className = "beer-photo";
    img.src = randomItem(imageFiles);
    img.alt = "";

    img.style.left = `${random(5, 85)}%`;
    img.style.top = `${random(10, 80)}%`;
    img.style.width = `${random(45, 140)}px`;
    img.dataset.rotation = random(-30, 30);

    beerPhotos.appendChild(img);
  }
}

beerScreen.addEventListener("pointerdown", (event) => {
  if (event.target.id === "beer-close") return;
  addBeerPhotos();
});

function drawBeer(time) {
  const width = window.innerWidth;
  const height = window.innerHeight;

  const dt = beerLastTime
    ? Math.min((time - beerLastTime) / 1000, 0.05)
    : 0.016;

  beerLastTime = time;

  beerCtx.clearRect(0, 0, width, height);

  let pitchDifference = 0;
  let rollDifference = 0;

  if (rawBeta !== null && beerBaseBeta !== null) {
    pitchDifference = rawBeta - beerBaseBeta;
  }

  if (rawGamma !== null && beerBaseGamma !== null) {
    rollDifference = rawGamma - beerBaseGamma;
  }

  const drinkingAngle = Math.max(
    0,
    Math.abs(pitchDifference) - 18
  );

  if (
    beerScreen.classList.contains("active") &&
    drinkingAngle > 0
  ) {
    beerLevel -= (drinkingAngle / 35) * 0.0008 * dt * 60;
    beerLevel = Math.max(0.02, beerLevel);
  }

  const surfaceY = height * (1 - beerLevel);

  beerSurfaceOffset +=
    ((rollDifference / 45) * 50 - beerSurfaceOffset) * 0.08;

  const beerGradient = beerCtx.createLinearGradient(
    0,
    surfaceY,
    0,
    height
  );

  beerGradient.addColorStop(0, "#f5c35b");
  beerGradient.addColorStop(0.25, "#e6a337");
  beerGradient.addColorStop(1, "#b66a13");

  beerCtx.fillStyle = beerGradient;
  beerCtx.beginPath();
  beerCtx.moveTo(0, surfaceY + beerSurfaceOffset);

  for (let x = 0; x <= width + 10; x += 10) {
    const wave =
      Math.sin(x * 0.012 + time * 0.0015) * 5 +
      Math.sin(x * 0.025 + time * 0.001) * 3;

    beerCtx.lineTo(
      x,
      surfaceY + beerSurfaceOffset + wave
    );
  }

  beerCtx.lineTo(width, height);
  beerCtx.lineTo(0, height);
  beerCtx.closePath();
  beerCtx.fill();

  /* FOAM */

  beerCtx.fillStyle = "#fff3d4";
  beerCtx.beginPath();
  beerCtx.moveTo(0, surfaceY + beerSurfaceOffset - 3);

  for (let x = 0; x <= width + 10; x += 8) {
    const foamWave =
      Math.sin(x * 0.04 + time * 0.001) * 4 +
      Math.sin(x * 0.09 + time * 0.0017) * 2;

    beerCtx.lineTo(
      x,
      surfaceY + beerSurfaceOffset + foamWave - 5
    );
  }

  beerCtx.lineTo(
    width,
    surfaceY + beerSurfaceOffset + 7
  );

  beerCtx.lineTo(
    0,
    surfaceY + beerSurfaceOffset + 7
  );

  beerCtx.closePath();
  beerCtx.fill();

  /* BUBBLES */

  for (let i = 0; i < 35; i++) {
    const bx = (i * 83 + time * 0.015) % width;

    const by =
      surfaceY + 20 +
      ((i * 47 + time * 0.035) %
        Math.max(30, height * beerLevel - 30));

    beerCtx.beginPath();
    beerCtx.arc(bx, by, (i % 3) + 1.5, 0, Math.PI * 2);
    beerCtx.fillStyle = "rgba(255,245,205,.35)";
    beerCtx.fill();
  }

  /* PHOTOS MOVE WITH TILT */

  beerPhotos.querySelectorAll(".beer-photo").forEach((img) => {
    const rotation = Number(img.dataset.rotation);

    img.style.transform =
      `translate(${rollDifference * 1.2}px, ${pitchDifference * 0.8}px) rotate(${rotation}deg)`;
  });

  requestAnimationFrame(drawBeer);
}

/* INITIAL STATE */

renderWord();
renderLetters();
renderDrawing();

</script>
</body>
</html>
