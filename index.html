
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARKO — 26</title>

<style>
@font-face {
  font-family: "NationalCode";
  src: url("NationalCodePiStd-Universal.otf") format("opentype");
  font-weight: 100 1000;
  font-style: normal;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: white;
  color: black;
  font-family: "NationalCode", sans-serif;
  overflow: hidden;
  cursor: crosshair;
}

/* MAIN CANVAS */

#canvas-area {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 1;
  pointer-events: none;
}

.marko {
  position: absolute;
  white-space: nowrap;
  line-height: 0.9;
  transform: translate(-50%, -50%) rotate(var(--rotation));
  animation: appear 180ms ease-out;
  user-select: none;
}

.marko-image {
  position: absolute;
  object-fit: contain;
  transform: translate(-50%, -50%) rotate(var(--rotation));
  animation: appear 180ms ease-out;
  user-select: none;
}

@keyframes appear {
  from {
    opacity: 0;
    scale: 0;
  }
  to {
    opacity: 1;
    scale: 1;
  }
}

/* BUTTONS */

.controls {
  position: fixed;
  left: 20px;
  bottom: 20px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

button {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 13px;
  font-weight: 600;
  background: white;
  color: black;
  border: 1px solid black;
  padding: 11px 16px;
  cursor: pointer;
  transition: background 150ms, color 150ms;
}

button:hover {
  background: black;
  color: white;
}

#click-counter {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 10;
  font-size: 15px;
  pointer-events: none;
}

/* WISH PANEL */

#wish-panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(255,255,255,0.96);
  align-items: center;
  justify-content: center;
  padding: 20px;
  cursor: default;
}

.wish-content {
  width: 100%;
  max-width: 500px;
}

.wish-content h2 {
  font-size: 42px;
  margin: 0 0 25px;
}

textarea {
  display: block;
  width: 100%;
  min-height: 150px;
  resize: vertical;
  padding: 15px;
  border: 1px solid black;
  border-radius: 0;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 16px;
  background: white;
  color: black;
  outline: none;
}

textarea:focus {
  border-width: 2px;
}

.wish-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 15px;
}

/* THANK YOU */

#thank-you-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: white;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 20px;
}

.thank-you-image {
  position: relative;
  width: min(650px, 80vw);
  height: min(450px, 60vh);
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
}

#thank-you-screen h1 {
  position: relative;
  font-size: clamp(50px, 12vw, 130px);
  line-height: 0.85;
  text-align: center;
  margin: 0;
  color: white;
  mix-blend-mode: difference;
  pointer-events: none;
}

/* =================================
   BEER SCREEN
================================= */

#beer-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 40;
  background:
    radial-gradient(
      ellipse at 50% 42%,
      #37332e 0%,
      #171614 65%,
      #090909 100%
    );
  align-items: center;
  justify-content: center;
  flex-direction: column;
  overflow: hidden;
  cursor: pointer;
  touch-action: manipulation;
}

#beer-title {
  position: absolute;
  top: 8%;
  width: 100%;
  text-align: center;
  color: #fff;
  font-family: Helvetica, Arial, sans-serif;
  font-size: clamp(22px, 5vw, 42px);
  font-weight: 900;
  line-height: 1.05;
  letter-spacing: -1.5px;
  z-index: 5;
}

/* GLASS */

#beer-glass {
  position: relative;
  width: min(65vw, 310px);
  height: min(57vh, 470px);
  margin-top: 35px;
  border: 2px solid rgba(255,255,255,0.52);
  border-top: 2px solid rgba(255,255,255,0.8);
  border-radius: 13px 13px 42px 42px;
  background: linear-gradient(
    90deg,
    rgba(255,255,255,0.2),
    rgba(255,255,255,0.015) 14%,
    rgba(255,255,255,0.035) 80%,
    rgba(255,255,255,0.18)
  );
  box-shadow:
    inset 8px 0 12px rgba(255,255,255,0.12),
    inset -8px 0 12px rgba(255,255,255,0.1),
    0 25px 65px rgba(0,0,0,0.45);
  transform-origin: center center;
  transition: transform 0.12s ease-out;
  overflow: hidden;
}

#beer-content {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 9px 9px 38px 38px;
}

/* BEER LIQUID */

#beer-liquid {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 85%;
  background: linear-gradient(
    90deg,
    #9c4900 0%,
    #d97900 12%,
    #f9a900 32%,
    #ffd04a 48%,
    #f2a000 72%,
    #a94c00 100%
  );
  box-shadow:
    inset 0 10px 18px rgba(255,255,255,0.24),
    inset 0 -10px 18px rgba(100,40,0,0.2);
  transition: height 0.12s linear;
  z-index: 1;
}

#beer-surface {
  position: absolute;
  left: -20%;
  top: -13px;
  width: 140%;
  height: 27px;
  border-radius: 50%;
  background: linear-gradient(
    180deg,
    #ffe69a,
    #ffbf36
  );
  box-shadow: 0 4px 12px rgba(255,230,160,0.35);
  transition: transform 0.12s ease-out;
}

#beer-foam {
  position: absolute;
  left: -5%;
  top: -27px;
  width: 110%;
  height: 52px;
  border-radius: 50%;
  background: radial-gradient(
    ellipse at 30% 45%,
    #fffdf2 0%,
    #fff1d2 65%,
    #e9d3a7 100%
  );
  box-shadow:
    0 4px 12px rgba(255,255,255,0.5),
    inset 0 -6px 8px rgba(180,140,80,0.15);
  transition: opacity 0.3s;
}

/* BUBBLES */

#beer-bubbles {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.beer-bubble {
  position: absolute;
  bottom: -10px;
  width: 4px;
  height: 4px;
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  animation: beer-bubble-rise 3s infinite ease-in;
}

@keyframes beer-bubble-rise {
  from {
    transform: translateY(0);
    opacity: 0;
  }
  20% {
    opacity: 0.65;
  }
  to {
    transform: translateY(-450px);
    opacity: 0;
  }
}

/* MARKO PHOTOS */

#marko-photos {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 3;
}

.beer-photo {
  position: absolute;
  object-fit: contain;
  filter: drop-shadow(0 4px 5px rgba(0,0,0,0.28));
  will-change: left, top, transform;
}

/* GLASS REFLECTIONS */

.glass-shine {
  position: absolute;
  top: 5%;
  left: 7%;
  width: 13px;
  height: 82%;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  filter: blur(4px);
  pointer-events: none;
  z-index: 5;
}

.glass-rim {
  position: absolute;
  top: 0;
  left: -2px;
  right: -2px;
  height: 9px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.8);
  box-shadow: 0 2px 10px rgba(255,255,255,0.25);
  pointer-events: none;
  z-index: 6;
}

.glass-base {
  position: absolute;
  bottom: 0;
  left: 10%;
  width: 80%;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.24);
  pointer-events: none;
  z-index: 6;
}

/* CONDENSATION */

#beer-glass::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  opacity: 0.55;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.7) 1px, transparent 2px),
    radial-gradient(circle at 88% 25%, rgba(255,255,255,.5) 2px, transparent 3px),
    radial-gradient(circle at 18% 65%, rgba(255,255,255,.45) 2px, transparent 3px),
    radial-gradient(circle at 83% 73%, rgba(255,255,255,.6) 1px, transparent 2px),
    radial-gradient(circle at 92% 48%, rgba(255,255,255,.4) 1px, transparent 2px),
    radial-gradient(circle at 8% 83%, rgba(255,255,255,.5) 2px, transparent 3px);
}

#beer-hint {
  position: absolute;
  bottom: 7%;
  color: rgba(255,255,255,0.65);
  font-family: Helvetica, Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 2px;
  text-align: center;
  padding: 0 15px;
}

#beer-close {
  position: absolute;
  top: 20px;
  right: 20px;
  color: white;
  background: transparent;
  border-color: rgba(255,255,255,0.6);
  z-index: 10;
}

/* MOBILE */

@media (max-width: 600px) {
  .controls {
    left: 10px;
    bottom: 12px;
    gap: 5px;
  }

  button {
    font-size: 11px;
    padding: 10px 9px;
  }

  #click-counter {
    right: 12px;
    bottom: 17px;
    font-size: 12px;
  }

  .wish-content h2 {
    font-size: 34px;
  }

  .thank-you-image {
    width: 90vw;
    height: 55vh;
  }

  #beer-glass {
    width: 70vw;
    height: 52vh;
  }

  #beer-title {
    top: 12%;
  }
}
</style>
</head>

<body>

<div id="canvas-area"></div>

<div class="controls">
  <button id="download-button">PNG DOWNLOAD ↓</button>
  <button id="beer-button">BEER</button>
  <button id="wish-button">ADD WISH +</button>
</div>

<div id="click-counter">0 / 10</div>

<!-- WISH PANEL -->

<div id="wish-panel">
  <div class="wish-content">
    <h2>MAKE A WISH</h2>

    <textarea
      id="wish-input"
      placeholder="Write your wish here..."
    ></textarea>

    <div class="wish-buttons">
      <button id="close-wish">CLOSE ×</button>
      <button id="submit-wish">SEND WISH ↑</button>
    </div>
  </div>
</div>

<!-- THANK YOU -->

<div id="thank-you-screen">
  <div class="thank-you-image" id="thank-you-image">
    <h1>THANK<br>YOU</h1>
  </div>
</div>

<!-- BEER -->

<div id="beer-screen">

  <button id="beer-close">CLOSE ×</button>

  <div id="beer-title">DRINK A BEER<br>WITH MARKO.</div>

  <div id="beer-glass">

    <div id="beer-content">

      <div id="beer-liquid">
        <div id="beer-bubbles"></div>
        <div id="beer-surface"></div>
        <div id="beer-foam"></div>
      </div>

      <div id="marko-photos"></div>

    </div>

    <div class="glass-shine"></div>
    <div class="glass-rim"></div>
    <div class="glass-base"></div>

  </div>

  <div id="beer-hint">TILT TO DRINK · TAP TO FILL WITH MARKO</div>

</div>

<script>

/* ELEMENTS */

const canvasArea = document.getElementById("canvas-area");
const counterDisplay = document.getElementById("click-counter");

const wishPanel = document.getElementById("wish-panel");
const wishInput = document.getElementById("wish-input");

const thankYouScreen = document.getElementById("thank-you-screen");
const thankYouImage = document.getElementById("thank-you-image");

const beerScreen = document.getElementById("beer-screen");
const beerGlass = document.getElementById("beer-glass");
const beerLiquid = document.getElementById("beer-liquid");
const beerSurface = document.getElementById("beer-surface");
const beerFoam = document.getElementById("beer-foam");
const beerBubbles = document.getElementById("beer-bubbles");
const markoPhotos = document.getElementById("marko-photos");

let clickCount = 0;
let sensorsEnabled = false;
let beerMode = false;

let beerLevel = 85;
let lastBeta = 0;
let lastGamma = 0;
let baselineBeta = null;
let baselineGamma = null;
let lastOrientationTime = 0;
let lastShake = 0;

const colors = [
  "#ff0000",
  "#0000ff",
  "#00a651",
  "#ff6600",
  "#ff00aa",
  "#8b00ff",
  "#000000",
  "#ffcc00",
  "#00a6a6"
];

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function randomImageNumber() {
  return Math.floor(Math.random() * 16) + 1;
}

/* SENSOR ACTIVATION */

async function enableSensors() {
  if (sensorsEnabled) return;

  try {
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      const permission =
        await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") return;
    }

    if ("DeviceOrientationEvent" in window) {
      window.addEventListener("deviceorientation", handleOrientation);
      sensorsEnabled = true;
    }

    if ("DeviceMotionEvent" in window) {
      window.addEventListener("devicemotion", handleMotion);
    }

  } catch (error) {
    console.log("Motion sensors unavailable:", error);
  }
}

/* CREATE MARKO ELEMENTS */

function createMarko() {

  if (Math.random() < 0.08) {
    createRandomImage();
    return;
  }

  const element = document.createElement("div");

  element.className = "marko";
  element.textContent = Math.random() < 0.5 ? "MARKO" : "26";

  const size = random(20, 150);
  const rotation = random(-35, 35);
  const color = colors[Math.floor(Math.random() * colors.length)];

  element.style.left = random(0, window.innerWidth) + "px";
  element.style.top = random(0, window.innerHeight) + "px";
  element.style.fontSize = size + "px";
  element.style.fontWeight = Math.floor(random(100, 1001));
  element.style.color = color;
  element.style.fontStyle = Math.random() < 0.35 ? "italic" : "normal";

  element.style.setProperty("--rotation", rotation + "deg");

  canvasArea.appendChild(element);
}

function createRandomImage() {
  const image = document.createElement("img");

  image.className = "marko-image";
  image.src = `${randomImageNumber()}.png`;

  const size = random(50, 190);
  const rotation = random(-35, 35);

  image.style.width = size + "px";
  image.style.height = size + "px";
  image.style.left = random(0, window.innerWidth) + "px";
  image.style.top = random(0, window.innerHeight) + "px";

  image.style.setProperty("--rotation", rotation + "deg");

  canvasArea.appendChild(image);
}

/* COUNTER AND RESET */

function updateCounter() {
  counterDisplay.textContent = clickCount + " / 10";
}

function resetCanvas() {
  canvasArea.innerHTML = "";
  clickCount = 0;
  updateCounter();
}

/* CLICK TO CREATE CHAOS */

document.addEventListener("click", async function(event) {

  if (
    event.target.closest("button") ||
    event.target.closest("#wish-panel") ||
    event.target.closest("#thank-you-screen") ||
    event.target.closest("#beer-screen")
  ) {
    return;
  }

  if (wishPanel.style.display === "flex") return;

  await enableSensors();

  clickCount++;

  if (clickCount >= 10) {
    resetCanvas();
    return;
  }

  const amount = Math.floor(random(15, 61));

  for (let i = 0; i < amount; i++) {
    createMarko();
  }

  updateCounter();
});

/* ORIENTATION */

function handleOrientation(event) {

  const beta = event.beta || 0;
  const gamma = event.gamma || 0;

  lastBeta = beta;
  lastGamma = gamma;

  if (beerMode) {
    updateBeer(beta, gamma);
    return;
  }

  document.querySelectorAll(".marko, .marko-image").forEach(element => {
    element.style.marginLeft = gamma * 1.1 + "px";
    element.style.marginTop = beta * 0.7 + "px";
  });
}

/* SHAKE */

function handleMotion(event) {

  if (beerMode) return;

  const acceleration = event.accelerationIncludingGravity;
  if (!acceleration) return;

  const force =
    Math.abs(acceleration.x || 0) +
    Math.abs(acceleration.y || 0) +
    Math.abs(acceleration.z || 0);

  const now = Date.now();

  if (force > 35 && now - lastShake > 700) {
    lastShake = now;

    document.querySelectorAll(".marko, .marko-image").forEach(element => {
      element.style.translate =
        `${random(-35, 35)}px ${random(-35, 35)}px`;
    });
  }
}

/* PNG DOWNLOAD */

document.getElementById("download-button").addEventListener("click", async function() {

  await document.fonts.ready;

  const width = window.innerWidth;
  const height = window.innerHeight;
  const scale = 2;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = width * scale;
  canvas.height = height * scale;

  ctx.scale(scale, scale);

  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, width, height);

  const elements = document.querySelectorAll(".marko, .marko-image");

  const images = Array.from(document.querySelectorAll(".marko-image"));

  await Promise.all(images.map(image => {
    if (image.complete && image.naturalWidth > 0) {
      return Promise.resolve();
    }

    return new Promise(resolve => {
      image.onload = resolve;
      image.onerror = resolve;
    });
  }));

  elements.forEach(element => {

    const rect = element.getBoundingClientRect();
    const style = window.getComputedStyle(element);

    ctx.save();

    ctx.translate(
      rect.left + rect.width / 2,
      rect.top + rect.height / 2
    );

    const rotation =
      parseFloat(element.style.getPropertyValue("--rotation")) || 0;

    ctx.rotate(rotation * Math.PI / 180);

    if (element.classList.contains("marko-image")) {

      if (element.complete && element.naturalWidth > 0) {
        ctx.drawImage(
          element,
          -rect.width / 2,
          -rect.height / 2,
          rect.width,
          rect.height
        );
      }

    } else {

      const size = parseFloat(style.fontSize);

      ctx.font =
        `${style.fontStyle} ${style.fontWeight} ${size}px "NationalCode"`;

      ctx.fillStyle = style.color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(element.textContent, 0, 0);
    }

    ctx.restore();
  });

  const link = document.createElement("a");

  link.download = "MARKO-26.png";
  link.href = canvas.toDataURL("image/png");
  link.click();

});

/* WISH PANEL */

document.getElementById("wish-button").addEventListener("click", function() {
  wishPanel.style.display = "flex";
  wishInput.focus();
});

document.getElementById("close-wish").addEventListener("click", function() {
  wishPanel.style.display = "none";
  wishInput.value = "";
});

function showRandomImage() {
  const imageNumber = randomImageNumber();
  thankYouImage.style.backgroundImage = `url("${imageNumber}.png")`;
}

document.getElementById("submit-wish").addEventListener("click", function() {

  if (wishInput.value.trim() === "") {
    wishInput.focus();
    return;
  }

  wishPanel.style.display = "none";
  wishInput.value = "";

  resetCanvas();
  showRandomImage();

  thankYouScreen.style.display = "flex";

});

thankYouScreen.addEventListener("click", function() {
  thankYouScreen.style.display = "none";
  resetCanvas();
});

/* =================================
   BEER MODE
================================= */

function openBeer() {

  beerMode = true;
  beerLevel = 85;

  baselineBeta = null;
  baselineGamma = null;
  lastOrientationTime = 0;

  beerLiquid.style.height = "85%";
  beerFoam.style.opacity = "1";

  markoPhotos.innerHTML = "";

  document.getElementById("beer-hint").textContent =
    "TILT TO DRINK · TAP TO FILL WITH MARKO";

  beerGlass.style.opacity = "1";
  beerGlass.style.transform = "none";

  beerScreen.style.display = "flex";

  createBeerBubbles();

}

/* OPEN BEER */

document.getElementById("beer-button").addEventListener("click", async function() {
  await enableSensors();
  openBeer();
});

/* TAP GLASS = FILL WITH PHOTOS */

beerGlass.addEventListener("click", function(event) {

  event.stopPropagation();

  if (!beerMode) return;

  const amount = Math.floor(random(2, 5));

  for (let i = 0; i < amount; i++) {
    addBeerPhoto();
  }

});

/* ADD PHOTOS */

function addBeerPhoto() {

  const image = document.createElement("img");

  image.className = "beer-photo";
  image.src = `${randomImageNumber()}.png`;

  const size = random(45, 95);

  const glassWidth = markoPhotos.clientWidth;
  const glassHeight = markoPhotos.clientHeight;

  const margin = size / 2 + 4;

  const x = random(margin, Math.max(margin, glassWidth - margin));
  const y = random(margin, Math.max(margin, glassHeight - margin));

  const rotation = random(-35, 35);

  image.dataset.x = x;
  image.dataset.y = y;

  image.dataset.vx = random(-0.5, 0.5);
  image.dataset.vy = random(-0.5, 0.5);

  image.dataset.rotation = rotation;
  image.dataset.spin = random(-0.4, 0.4);
  image.dataset.size = size;

  image.style.width = size + "px";
  image.style.height = size + "px";

  image.style.left = x + "px";
  image.style.top = y + "px";

  image.style.transform =
    `translate(-50%, -50%) rotate(${rotation}deg)`;

  markoPhotos.appendChild(image);

}

/* TILT = DRINK BEER AND MOVE PHOTOS */

function updateBeer(beta, gamma) {

  if (!beerMode) return;

  const now = Date.now();

  // Establish the upright phone position as the baseline
  if (baselineBeta === null) {
    baselineBeta = beta;
    baselineGamma = gamma;
    lastOrientationTime = now;
  }

  const deltaBeta = beta - baselineBeta;
  const deltaGamma = gamma - baselineGamma;

  const deltaTime = Math.min(
    (now - lastOrientationTime) / 1000,
    0.1
  );

  lastOrientationTime = now;

  // GLASS MOVEMENT
  const tilt = Math.max(-35, Math.min(35, deltaGamma));

  beerGlass.style.transform =
    `perspective(800px) rotate(${tilt * 0.45}deg)`;

  // BEER SURFACE
  beerSurface.style.transform =
    `translateY(${deltaBeta * 0.25}px) rotate(${-deltaGamma * 0.7}deg)`;

  // DRINK BEER WHEN TILTING FORWARD OR BACKWARD
  const drinkingAngle = Math.max(0, Math.abs(deltaBeta) - 30);

  if (drinkingAngle > 0 && beerLevel > 0) {

    beerLevel = Math.max(
      0,
      beerLevel - drinkingAngle * 0.0008 * Math.max(deltaTime, 0.016) * 60
    );

    beerLiquid.style.height = beerLevel + "%";
    beerFoam.style.opacity = Math.max(0, beerLevel / 85);

  }

  // PHOTO MOVEMENT: SIMPLE GRAVITY + INERTIA
  const photos = document.querySelectorAll(".beer-photo");

  const width = markoPhotos.clientWidth;
  const height = markoPhotos.clientHeight;

  photos.forEach(photo => {

    let x = parseFloat(photo.dataset.x);
    let y = parseFloat(photo.dataset.y);

    let vx = parseFloat(photo.dataset.vx);
    let vy = parseFloat(photo.dataset.vy);

    let rotation = parseFloat(photo.dataset.rotation);
    let spin = parseFloat(photo.dataset.spin);

    const size = parseFloat(photo.dataset.size);

    // Tilt acts like gravity
    vx += deltaGamma * 0.012;
    vy += deltaBeta * 0.012;

    // Friction
    vx *= 0.94;
    vy *= 0.94;

    // Move photos
    x += vx;
    y += vy;

    // Bounce at glass walls
    const halfSize = size / 2;

    if (x < halfSize || x > width - halfSize) {
      vx *= -0.55;
      x = Math.max(halfSize, Math.min(width - halfSize, x));
    }

    if (y < halfSize || y > height - halfSize) {
      vy *= -0.55;
      y = Math.max(halfSize, Math.min(height - halfSize, y));
    }

    // Rotation
    rotation += spin + vx * 0.12;

    // Save movement
    photo.dataset.x = x;
    photo.dataset.y = y;

    photo.dataset.vx = vx;
    photo.dataset.vy = vy;

    photo.dataset.rotation = rotation;

    // Update image
    photo.style.left = x + "px";
    photo.style.top = y + "px";

    photo.style.transform =
      `translate(-50%, -50%) rotate(${rotation}deg)`;

  });

  if (beerLevel <= 0) {
    document.getElementById("beer-hint").textContent =
      "ALL GONE. ONLY MARKO LEFT.";
  }

}

/* BUBBLES */

function createBeerBubbles() {

  beerBubbles.innerHTML = "";

  for (let i = 0; i < 25; i++) {

    const bubble = document.createElement("div");

    bubble.className = "beer-bubble";
    bubble.style.left = random(5, 95) + "%";
    bubble.style.animationDelay = random(0, 4) + "s";
    bubble.style.animationDuration = random(2, 5) + "s";

    beerBubbles.appendChild(bubble);

  }

}

/* CLOSE BEER */

document.getElementById("beer-close").addEventListener("click", function(event) {

  event.stopPropagation();

  beerMode = false;
  beerScreen.style.display = "none";

  beerGlass.style.transform = "none";
  beerGlass.style.opacity = "1";

});

</script>
