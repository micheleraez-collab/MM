
<!DOCTYPE html>

<style>
@font-face {
  font-family: "NationalCode";
  src: url("NationalCodePiStd-Universal.otf") format("opentype");
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  font-family: Helvetica, Arial, sans-serif;
}

#canvas-area {
  position: fixed;
  inset: 0;
  overflow: hidden;
}

.item {
  position: absolute;
  white-space: nowrap;
  font-family: "NationalCode", sans-serif;
  user-select: none;
  pointer-events: none;
  transform-origin: center;
}

.item img {
  display: block;
  width: auto;
  height: auto;
  max-width: min(42vw, 260px);
  max-height: min(42vh, 260px);
  object-fit: contain;
}

.controls {
  position: fixed;
  left: 16px;
  bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  z-index: 10;
}

button {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 11px;
  letter-spacing: .02em;
  padding: 10px 13px;
  border: 1px solid black;
  background: white;
  color: black;
  cursor: pointer;
}

#click-counter {
  position: fixed;
  right: 16px;
  bottom: 16px;

  z-index: 10;
}

/* WISH */

#wish-panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;

  align-items: center;

}

#wish-panel-inner {

}

}

#thank-you-screen {

  justify-content: center;

}

#thank-you-screen img {
  width: 100%;
  height: 100%;

}

#thank-you-screen span {

  font-family: "NationalCode", sans-serif;
  font-size: clamp(50px, 14vw, 150px);
  pointer-events: none;
}

/* BEER */

#beer-screen {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  z-index: 50;
  overflow: hidden;
  background: #17100a;
  touch-action: none;
}

#beer-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#beer-photos {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.beer-photo {
  position: absolute;
  width: clamp(75px, 22vw, 145px);
  height: clamp(75px, 22vw, 145px);
  object-fit: cover;
  box-shadow: 0 3px 15px rgba(0,0,0,.3);
  will-change: transform;
}

#beer-close {
  position: absolute;

}

/* HANGMAN */

#hangman-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: white;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-y: auto;
}

#hangman-close {
  position: absolute;
  top: 16px;
  right: 16px;

}

.hangman-content {
  position: relative;
  z-index: 2;
  width: min(440px, 100%);
  text-align: center;
}

.hangman-title {
  font-family: "NationalCode", sans-serif;
  font-size: clamp(42px, 10vw, 75px);
}

.hangman-subtitle {
  font-size: 11px;
  letter-spacing: .12em;
  margin-top: 5px;
}

#hangman-drawing {
  width: 190px;
  margin: 20px auto 10px;
}

#hangman-drawing svg {
  width: 100%;
}

/* Buchstabenanzeige */

#hangman-word {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: center;
  gap: 9px;
  margin: 25px 0;
  color: black;
}

.hm-letter {
  width: 34px;
  min-width: 34px;
  height: 42px;
  border-bottom: 2px solid black;
  display: flex;
  align-items: center;
  justify-content: center;

  font-family: Helvetica, Arial, sans-serif;

}

#hangman-message {
  font-size: 11px;
  margin-bottom: 20px;
}

#hangman-letters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 7px;
  max-width: 360px;
  margin: 0 auto;
}

#hangman-letters button {
  width: 35px;
  height: 35px;
  padding: 0;
}

#hangman-letters button:disabled {
  opacity: .2;
  cursor: default;
}

#hangman-restart {
  display: none;
  margin: 25px auto 0;
}

/* WIN WIN WIN */

#you-won {
  display: none;
  font-family: "NationalCode", sans-serif;
  font-size: clamp(45px, 13vw, 105px);
  line-height: 1;
  margin: 25px 0;

  animation: wonBlink .55s steps(2, start) infinite;
}

@keyframes wonBlink {

    visibility: hidden;
  }
}

/* WIN IMAGES */

#win-images {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;

}

#win-images img {
  position: absolute;
  width: var(--size);
  height: var(--size);
  object-fit: cover;
  animation: markoPop .5s ease-out both;
  animation-delay: var(--delay);
}

@keyframes markoPop {
  0% {
    opacity: 0;
    transform: scale(.1) rotate(var(--rotation));
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(var(--rotation));
  }

<body>

<div id="canvas-area"></div>

<div class="controls">

<div id="click-counter">0 / 10</div>

<!-- WISH -->

<div id="wish-panel">
  <div id="wish-panel-inner">

<!-- HANGMAN -->

<div id="hangman-screen">
  <div id="win-images"></div>

  <button id="hangman-close">CLOSE ×</button>

  <div class="hangman-content">
    <div class="hangman-title">GESCHENK »</div>
    <div class="hangman-subtitle">RATE DAS WORT.</div>

    <div id="hangman-drawing">
      <svg viewBox="0 0 220 190">
        <path d="M30 175 H145 M60 175 V15 H145 V40"
              stroke="black" stroke-width="3" fill="none"/>

                stroke="black" stroke-width="3"

              stroke="black" stroke-width="3"

              stroke="black" stroke-width="3"

<script>

/* ==================================================
   SETTINGS
================================================== */

const imageFiles = Array.from(
  {length: 16},
  (_, i) => `${i + 1}.png`
);

const random = (min, max) =>
  Math.random() * (max - min) + min;

const randomImage = () =>
  imageFiles[Math.floor(Math.random() * imageFiles.length)];

const colors = [
  "#000000",
  "#e52b24",
  "#2449d8",
  "#f1bd00",
  "#00a36c",
  "#a52bcb",
  "#ff5c35",
  "#6a3e2b"
];


/* ==================================================
   DEVICE MOTION
================================================== */

let sensorEnabled = false;
let tiltX = 0;
let tiltY = 0;
let targetTiltX = 0;
let targetTiltY = 0;
let rawBeta = null;

async function enableSensors() {
  if (sensorEnabled) return;

  if (
    typeof DeviceOrientationEvent !== "undefined" &&
    typeof DeviceOrientationEvent.requestPermission === "function"
  ) {
    try {
      const permission =
        await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") return;
    } catch (error) {
      console.log("Motion permission unavailable");
      return;
    }
  }

  window.addEventListener("deviceorientation", event => {
    if (event.beta == null || event.gamma == null) return;

    rawBeta = event.beta;

    targetTiltX = Math.max(-1, Math.min(1, event.gamma / 35));
    targetTiltY = Math.max(-1, Math.min(1, event.beta / 60));
  }, true);

  sensorEnabled = true;
}

function smoothSensors() {
  tiltX += (targetTiltX - tiltX) * .09;
  tiltY += (targetTiltY - tiltY) * .09;
  requestAnimationFrame(smoothSensors);
}

smoothSensors();


/* ==================================================
   LANDING PAGE
================================================== */

const canvasArea = document.getElementById("canvas-area");
const counter = document.getElementById("click-counter");

let items = [];
let clickCount = 0;

function createItem() {
  const element = document.createElement("div");
  element.className = "item";

  if (Math.random() < .12) {
    const img = document.createElement("img");
    img.src = randomImage();
    element.appendChild(img);
  } else {
    element.textContent = Math.random() < .5 ? "MARKO" : "26";
    element.style.fontSize = `${random(13, 150)}px`;
    element.style.color = colors[Math.floor(Math.random() * colors.length)];
    element.style.fontWeight = Math.random() < .5 ? "normal" : "bold";
    element.style.fontStyle = Math.random() < .22 ? "italic" : "normal";
    element.style.letterSpacing = `${random(-5, 8)}px`;
  }

  let x, y;

  if (Math.random() < .65 && items.length > 0) {
    const anchor = items[Math.floor(Math.random() * items.length)];
    x = anchor.x + random(-180, 180);
    y = anchor.y + random(-160, 160);
  } else {
    x = random(-80, window.innerWidth - 40);
    y = random(-70, window.innerHeight - 40);
  }

  const rotation = random(-75, 75);

  element.style.left = `${x}px`;
  element.style.top = `${y}px`;
  element.style.transform = `rotate(${rotation}deg)`;

  canvasArea.appendChild(element);

  items.push({
    element,
    x,
    y,
    vx: random(-2.8, 2.8),
    vy: random(-2.8, 2.8),
    rotation,
    rotationSpeed: random(-.7, .7)
  });
}

function createComposition() {
  clickCount++;

  if (clickCount >= 10) {
    canvasArea.innerHTML = "";
    items = [];
    clickCount = 0;
  } else {
    const roll = Math.random();
    let amount;

    if (roll < .15) {
      amount = Math.floor(random(3, 12));
    } else if (roll < .45) {
      amount = Math.floor(random(12, 30));
    } else if (roll < .8) {
      amount = Math.floor(random(30, 65));
    } else {
      amount = Math.floor(random(65, 110));
    }

    for (let i = 0; i < amount; i++) {
      createItem();
    }
  }

  counter.textContent = `${clickCount} / 10`;
}

canvasArea.addEventListener("click", () => {
  enableSensors();
  createComposition();
});


/* ==================================================
   LANDING PAGE MOVEMENT
================================================== */

function animateItems() {
  const width = window.innerWidth;
  const height = window.innerHeight;

  items.forEach(item => {
    item.vx += tiltX * .15;
    item.vy += tiltY * .15;

    item.vx *= .985;
    item.vy *= .985;

    item.x += item.vx;
    item.y += item.vy;
    item.rotation += item.rotationSpeed;

    const rect = item.element.getBoundingClientRect();

    if (item.x > width - rect.width || item.x < -rect.width) {
      item.vx *= -.75;
    }

    if (item.y > height - rect.height || item.y < -rect.height) {
      item.vy *= -.75;
    }

    item.element.style.left = `${item.x}px`;
    item.element.style.top = `${item.y}px`;
    item.element.style.transform = `rotate(${item.rotation}deg)`;
  });

  requestAnimationFrame(animateItems);
}

animateItems();


/* ==================================================
   WISH
================================================== */

const wishPanel = document.getElementById("wish-panel");
const wishText = document.getElementById("wish-text");
const thankYouScreen = document.getElementById("thank-you-screen");

document.getElementById("wish-button").onclick = () => {
  wishPanel.style.display = "flex";
  wishText.value = "";
};

document.getElementById("cancel-wish").onclick = () => {
  wishPanel.style.display = "none";
};

document.getElementById("submit-wish").onclick = () => {
  if (!wishText.value.trim()) return;

  wishPanel.style.display = "none";
  canvasArea.innerHTML = "";
  items = [];
  clickCount = 0;
  counter.textContent = "0 / 10";

  document.getElementById("thank-you-image").src = randomImage();
  thankYouScreen.style.display = "flex";
};

thankYouScreen.onclick = () => {
  thankYouScreen.style.display = "none";
};


/* ==================================================
   BEER MODE
================================================== */

const beerScreen = document.getElementById("beer-screen");
const beerCanvas = document.getElementById("beer-canvas");
const ctx = beerCanvas.getContext("2d");
const beerPhotos = document.getElementById("beer-photos");

let beerLevel = .94;
let beerAngle = 0;
let beerAngleVelocity = 0;
let beerSlosh = 0;
let beerSloshVelocity = 0;
let beerLastTime = 0;
let beerRunning = false;
let beerPhotoItems = [];
let beerBaseBeta = 0;
let beerBaseCaptured = false;

function resizeBeer() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  beerCanvas.width = window.innerWidth * dpr;
  beerCanvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeBeer);

function openBeer() {
  enableSensors();

  beerScreen.style.display = "block";
  canvasArea.style.display = "none";
  document.querySelector(".controls").style.display = "none";
  counter.style.display = "none";

  beerPhotos.innerHTML = "";
  beerPhotoItems = [];

  beerLevel = .94;
  beerAngle = 0;
  beerAngleVelocity = 0;
  beerSlosh = 0;
  beerSloshVelocity = 0;

  beerBaseCaptured = rawBeta !== null;

  if (beerBaseCaptured) beerBaseBeta = rawBeta;

  resizeBeer();
  beerRunning = true;
  beerLastTime = performance.now();

  requestAnimationFrame(animateBeer);
}

function closeBeer() {
  beerRunning = false;
  beerScreen.style.display = "none";
  canvasArea.style.display = "block";
  document.querySelector(".controls").style.display = "flex";
  counter.style.display = "block";
}

document.getElementById("beer-button").onclick = openBeer;
document.getElementById("beer-close").onclick = closeBeer;


/* Fotos im Bier */

beerScreen.addEventListener("pointerdown", event => {
  if (event.target.id === "beer-close") return;

  const amount = Math.floor(random(2, 5));

  for (let i = 0; i < amount; i++) {
    const img = document.createElement("img");
    img.className = "beer-photo";
    img.src = randomImage();

    const size = random(75, 135);
    img.style.width = `${size}px`;
    img.style.height = `${size}px`;

    beerPhotos.appendChild(img);

    beerPhotoItems.push({
      element: img,
      x: random(0, window.innerWidth - size),
      y: random(0, window.innerHeight - size),
      vx: random(-2, 2),
      vy: random(-2, 2),
      size,
      rotation: random(-25, 25),
      spin: random(-.5, .5)
    });
  }
});

function updatePhotos(dt) {
  const w = window.innerWidth;
  const h = window.innerHeight;

  beerPhotoItems.forEach(photo => {
    photo.vx += tiltX * 18 * dt;
    photo.vy += tiltY * 18 * dt;

    photo.vx *= Math.pow(.985, dt * 60);
    photo.vy *= Math.pow(.985, dt * 60);

    photo.x += photo.vx * dt * 60;
    photo.y += photo.vy * dt * 60;
    photo.rotation += photo.spin * dt * 60;

    if (photo.x < 0) {
      photo.x = 0;
      photo.vx *= -.8;
    }

    if (photo.x + photo.size > w) {
      photo.x = w - photo.size;
      photo.vx *= -.8;
    }

    if (photo.y < 0) {
      photo.y = 0;
      photo.vy *= -.8;
    }

    if (photo.y + photo.size > h) {
      photo.y = h - photo.size;
      photo.vy *= -.8;
    }

    photo.element.style.left = "0";
    photo.element.style.top = "0";
    photo.element.style.transform =
      `translate(${photo.x}px, ${photo.y}px) rotate(${photo.rotation}deg)`;
  });
}


/* Flüssigkeitsphysik */

function updateBeerPhysics(dt) {
  const targetAngle = Math.atan2(-tiltX, tiltY || .001);

  beerAngleVelocity += (targetAngle - beerAngle) * 3.5 * dt;
  beerAngleVelocity *= Math.pow(.86, dt * 60);
  beerAngle += beerAngleVelocity * dt * 60;

  beerAngle = Math.max(-1.05, Math.min(1.05, beerAngle));

  beerSloshVelocity += (tiltX * .5 - beerSlosh) * 2.5 * dt;
  beerSloshVelocity *= Math.pow(.92, dt * 60);
  beerSlosh += beerSloshVelocity * dt * 60;

  /*
    Trinkmechanik: Die Haltung beim Öffnen ist
    die Ausgangsposition. Erst ab 18 Grad Abweichung
    wird Bier verbraucht.
  */

  if (rawBeta !== null) {
    if (!beerBaseCaptured) {
      beerBaseBeta = rawBeta;
      beerBaseCaptured = true;
    }

    let pitchFromRest = rawBeta - beerBaseBeta;

    if (pitchFromRest > 180) pitchFromRest -= 360;
    if (pitchFromRest < -180) pitchFromRest += 360;

    const drinkingAngle = Math.max(0, Math.abs(pitchFromRest) - 18);

    if (drinkingAngle > 0 && beerLevel > .01) {
      const drinkingSpeed = drinkingAngle / 35;
      beerLevel -= drinkingSpeed * .0008 * dt * 60;
      beerLevel = Math.max(.01, beerLevel);
    }
  }
}


/* Oberfläche */

function surfaceY(x, time, width, height) {
  const centerX = width / 2;
  const baseY = height * (1 - beerLevel);
  const slope = Math.tan(beerAngle);

  const movement =
    Math.sin(x * .009 + time * .0015) * beerSlosh * 13;

  const wave =
    Math.sin(x * .018 + time * .0018) * 2.5 +
    Math.sin(x * .038 - time * .0012) * 1.3 +
    Math.sin(x * .006 + time * .0008) * 3;

  return baseY + (x - centerX) * slope + movement + wave;
}


/* Bier zeichnen */

function drawBeer(time) {
  const w = window.innerWidth;
  const h = window.innerHeight;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#160d07";
  ctx.fillRect(0, 0, w, h);

  const points = [];

  for (let x = -10; x <= w + 10; x += 3) {
    points.push({x, y: surfaceY(x, time, w, h)});
  }

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, h);
  ctx.lineTo(0, points[0].y);

  points.forEach(p => ctx.lineTo(p.x, p.y));

  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.clip();

  const liquid = ctx.createLinearGradient(0, 0, w * .6, h);
  liquid.addColorStop(0, "#f8c45d");
  liquid.addColorStop(.18, "#e99b26");
  liquid.addColorStop(.42, "#ce7914");
  liquid.addColorStop(.72, "#a9530b");
  liquid.addColorStop(1, "#612a08");

  ctx.fillStyle = liquid;
  ctx.fillRect(0, 0, w, h);

  const glow = ctx.createRadialGradient(
    w * .3, h * .45, 5,
    w * .3, h * .45, w * .85
  );

  glow.addColorStop(0, "rgba(255,224,142,.35)");
  glow.addColorStop(.45, "rgba(255,174,48,.12)");
  glow.addColorStop(1, "rgba(40,12,0,.35)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < 160; i++) {
    const x = (i * 97.31) % w;
    const y = (i * 173.13 - time * (.018 + (i % 5) * .004)) % h;

    if (y < 0) continue;

    const r = .5 + (i % 4) * .45;

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,232,170,.3)";
    ctx.fill();
  }

  ctx.restore();

  /* Schaum */

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(w, 0);

  for (let i = points.length - 1; i >= 0; i--) {
    ctx.lineTo(points[i].x, points[i].y);
  }

  ctx.closePath();

  const foam = ctx.createLinearGradient(0, 0, 0, 65);
  foam.addColorStop(0, "#fffdf5");
  foam.addColorStop(.5, "#f9f0dc");
  foam.addColorStop(1, "#e5d3b2");

  ctx.fillStyle = foam;
  ctx.fill();

  for (let i = 0; i < 260; i++) {
    const x = (i * 37.71) % w;
    const y = surfaceY(x, time, w, h) + random(-7, 7);
    const r = random(1, 3.8);

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);

    ctx.fillStyle = i % 3 === 0
      ? "rgba(255,255,255,.9)"
      : "rgba(221,197,158,.45)";

    ctx.fill();
  }

  ctx.beginPath();

  points.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y + 5);
    else ctx.lineTo(p.x, p.y + 5);
  });

  ctx.strokeStyle = "rgba(73,35,9,.25)";
  ctx.lineWidth = 7;
  ctx.filter = "blur(5px)";
  ctx.stroke();
  ctx.filter = "none";

  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation = "screen";

  const highlight = ctx.createLinearGradient(0, 0, w, h);
  highlight.addColorStop(0, "rgba(255,255,255,.09)");
  highlight.addColorStop(.35, "rgba(255,255,255,0)");
  highlight.addColorStop(1, "rgba(255,255,255,.04)");

  ctx.fillStyle = highlight;
  ctx.fillRect(0, 0, w, h);

  ctx.restore();
}


/* Bier-Animation */

function animateBeer(time) {
  if (!beerRunning) return;

  const dt = Math.min((time - beerLastTime) / 1000, .04);
  beerLastTime = time;

  updateBeerPhysics(dt);
  drawBeer(time);
  updatePhotos(dt);

  requestAnimationFrame(animateBeer);
}


/* ==================================================
   HANGMAN – GESCHENK
================================================== */

const hangmanScreen = document.getElementById("hangman-screen");
const hangmanWord = document.getElementById("hangman-word");
const hangmanMessage = document.getElementById("hangman-message");
const hangmanLetters = document.getElementById("hangman-letters");
const hangmanRestart = document.getElementById("hangman-restart");
const winImages = document.getElementById("win-images");
const youWon = document.getElementById("you-won");

const solution = "FREITAG";
const maxMistakes = 6;

let guessedLetters = [];
let mistakes = 0;
let gameFinished = false;

const bodyParts = [
  "hm-head",
  "hm-body",
  "hm-arm1",
  "hm-arm2",
  "hm-leg1",
  "hm-leg2"
];

function openHangman() {
  hangmanScreen.style.display = "flex";
  startHangman();
}

function closeHangman() {
  hangmanScreen.style.display = "none";
}

document.getElementById("gift-button")
  .addEventListener("click", openHangman);

document.getElementById("hangman-close")
  .addEventListener("click", closeHangman);

hangmanRestart.addEventListener("click", startHangman);


/* Neues Spiel */

function startHangman() {
  guessedLetters = [];
  mistakes = 0;
  gameFinished = false;

  bodyParts.forEach(id => {
    document.getElementById(id).setAttribute("opacity", "0");
  });

  winImages.innerHTML = "";
  youWon.style.display = "none";

  hangmanRestart.style.display = "none";
  hangmanMessage.style.display = "block";
  hangmanMessage.textContent = "6 VERSUCHE ÜBRIG";

  renderWord();
  renderLetters();
}


/* Wort mit festen Positionen anzeigen */

function renderWord() {
  hangmanWord.innerHTML = "";

  for (let i = 0; i < solution.length; i++) {
    const letter = solution[i];
    const span = document.createElement("div");

    span.className = "hm-letter";

    if (guessedLetters.includes(letter)) {
      span.textContent = letter;
    } else {
      span.textContent = "\u00A0";
    }

    hangmanWord.appendChild(span);
  }
}


/* Tastatur anzeigen */

function renderLetters() {
  hangmanLetters.innerHTML = "";

  "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
    const button = document.createElement("button");

    button.textContent = letter;
    button.disabled = guessedLetters.includes(letter) || gameFinished;

    button.addEventListener("click", () => {
      guessLetter(letter);
    });

    hangmanLetters.appendChild(button);
  });
}


/* Buchstaben raten */

function guessLetter(letter) {
  if (gameFinished || guessedLetters.includes(letter)) return;

  guessedLetters.push(letter);

  if (!solution.includes(letter)) {
    mistakes++;

    if (mistakes <= bodyParts.length) {
      document.getElementById(bodyParts[mistakes - 1])
        .setAttribute("opacity", "1");
    }
  }

  renderWord();
  renderLetters();

  const wordSolved = solution
    .split("")
    .every(letter => guessedLetters.includes(letter));

  if (wordSolved) {
    finishHangman(true);
  } else if (mistakes >= maxMistakes) {
    finishHangman(false);
  } else {
    hangmanMessage.textContent =
      `${maxMistakes - mistakes} VERSUCHE ÜBRIG`;
  }
}


/* Gewinnanimation mit Marko-Bildern */

function showWinImages() {
  winImages.innerHTML = "";

  for (let i = 0; i < 60; i++) {
    const img = document.createElement("img");

    img.src = randomImage();

    const size = random(45, 180);
    const rotation = random(-45, 45);
    const delay = random(0, 1.5);

    img.style.setProperty("--size", `${size}px`);
    img.style.setProperty("--rotation", `${rotation}deg`);
    img.style.setProperty("--delay", `${delay}s`);

    img.style.left = `${random(-5, 95)}%`;
    img.style.top = `${random(-5, 100)}%`;

    winImages.appendChild(img);
  }
}


/* Spiel beenden */

function finishHangman(won) {
  gameFinished = true;
  renderLetters();

  if (won) {
    showWinImages();

    youWon.style.display = "block";
    hangmanMessage.style.display = "none";
  } else {
    winImages.innerHTML = "";
    youWon.style.display = "none";

    hangmanMessage.style.display = "block";
    hangmanMessage.textContent =
      "GAME OVER – DAS WORT WAR FREITAG.";

    renderWord();
  }

  hangmanRestart.style.display = "block";
}


/* ==================================================
   INITIALISIERUNG
================================================== */

document.addEventListener("pointerdown", () => {
  enableSensors();
}, {once: true});
