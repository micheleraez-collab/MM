
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOTTIE</title>

<style>
@font-face {
  font-family: "NationalCode";
  src: url("NationalCodePiStd-Universal.otf") format("opentype");
  font-weight: 100 1000;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: white;
  color: black;
  font-family: "NationalCode", sans-serif;
  overflow: hidden;
  cursor: crosshair;
}

#canvas-area {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 1;
  pointer-events: none;
}

.marko {
  position: absolute;
  white-space: nowrap;
  line-height: 0.9;
  transform: translate(-50%, -50%) rotate(var(--rotation));
  animation: appear 180ms ease-out;
  user-select: none;
  will-change: transform;
}

.marko-image {
  position: absolute;
  object-fit: contain;
  transform: translate(-50%, -50%) rotate(var(--rotation));
  animation: appear 180ms ease-out;
  user-select: none;
  will-change: transform;
}

@keyframes appear {
  from { opacity: 0; scale: 0; }
  to { opacity: 1; scale: 1; }
}

/* BUTTONS */

.controls {
  position: fixed;
  left: 20px;
  bottom: 20px;
  display: flex;
  gap: 8px;
  z-index: 10;
}

button {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 13px;
  font-weight: 600;
  background: white;
  color: black;
  border: 1px solid black;
  padding: 11px 16px;
  cursor: pointer;
  transition: background 150ms, color 150ms;
}

button:hover {
  background: black;
  color: white;
}

#click-counter {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 10;
  font-size: 15px;
  pointer-events: none;
}

/* WISH PANEL */

#wish-panel {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(255,255,255,0.96);
  align-items: center;
  justify-content: center;
  padding: 20px;
  cursor: default;
}

.wish-content {
  width: 100%;
  max-width: 500px;
}

.wish-content h2 {
  font-size: 42px;
  margin: 0 0 25px;
}

textarea {
  display: block;
  width: 100%;
  min-height: 150px;
  resize: vertical;
  padding: 15px;
  border: 1px solid black;
  border-radius: 0;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 16px;
  background: white;
  color: black;
  outline: none;
}

.wish-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 15px;
}

/* THANK YOU */

#thank-you-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: white;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 20px;
}

.thank-you-image {
  position: relative;
  width: min(650px, 80vw);
  height: min(450px, 60vh);
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
}

#thank-you-screen h1 {
  position: relative;
  font-size: clamp(50px, 12vw, 130px);
  line-height: 0.85;
  text-align: center;
  margin: 0;
  color: white;
  mix-blend-mode: difference;
  pointer-events: none;
}

/* BEER MODE */

#beer-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 40;
  background: #111;
  overflow: hidden;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

#beer-glass {
  position: relative;
  width: min(72vw, 360px);
  height: min(78vh, 580px);
  border: 5px solid rgba(255,255,255,0.8);
  border-top: 0;
  border-radius: 0 0 45px 45px;
  overflow: hidden;
  transform: perspective(700px) rotate(0deg);
  background: rgba(255,255,255,0.08);
  box-shadow:
    inset 12px 0 18px rgba(255,255,255,0.12),
    inset -12px 0 18px rgba(0,0,0,0.2),
    0 0 35px rgba(255,255,255,0.12);
}

#beer-liquid {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 82%;
  background:
    linear-gradient(
      90deg,
      rgba(150,65,0,0.9),
      #f6a900 18%,
      #ffc02e 48%,
      #d87a00 85%,
      rgba(130,55,0,0.9)
    );
  border-radius: 0 0 38px 38px;
  transition: height 0.25s ease;
  overflow: hidden;
}

#beer-surface {
  position: absolute;
  top: 0;
  left: -20%;
  width: 140%;
  height: 28px;
  background: #ffca48;
  border-radius: 50%;
  transform: rotate(0deg);
  box-shadow: 0 4px 12px rgba(255,255,255,0.4);
}

#beer-foam {
  position: absolute;
  top: -32px;
  left: -5%;
  width: 110%;
  height: 55px;
  background: #fff4d6;
  border-radius: 50%;
  box-shadow:
    0 4px 10px rgba(255,255,255,0.4),
    inset 0 -5px 8px rgba(220,170,80,0.2);
}

.bubble {
  position: absolute;
  bottom: 0;
  width: 7px;
  height: 7px;
  background: rgba(255,255,255,0.55);
  border-radius: 50%;
  animation: bubbleUp 2.5s infinite ease-in;
}

@keyframes bubbleUp {
  from { transform: translateY(0); opacity: 0; }
  20% { opacity: 0.8; }
  to { transform: translateY(-400px); opacity: 0; }
}

#beer-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  color: rgba(255,255,255,0.9);
  font-family: Helvetica, Arial, sans-serif;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 4px;
  text-shadow: 0 2px 5px rgba(0,0,0,0.3);
  pointer-events: none;
}

#beer-hint {
  position: absolute;
  bottom: 35px;
  color: white;
  font-family: Helvetica, Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 1px;
  opacity: 0.7;
  text-align: center;
  pointer-events: none;
}

#beer-close {
  position: absolute;
  top: 20px;
  right: 20px;
  color: white;
  background: transparent;
  border-color: white;
  z-index: 2;
}

/* MOBILE */

@media (max-width: 600px) {
  .controls {
    left: 10px;
    bottom: 12px;
    gap: 5px;
  }

  button {
    font-size: 11px;
    padding: 10px 9px;
  }

  #click-counter {
    right: 12px;
    bottom: 17px;
    font-size: 12px;
  }

  .wish-content h2 {
    font-size: 34px;
  }

  .thank-you-image {
    width: 90vw;
    height: 55vh;
  }

  #beer-glass {
    width: 75vw;
    height: 65vh;
  }
}
</style>
</head>

<body>

<div id="canvas-area"></div>

<div class="controls">
  <button id="download-button">PNG DOWNLOAD ↓</button>
  <button id="beer-button">BEER</button>
  <button id="wish-button">ADD WISH +</button>
</div>

<div id="click-counter">0 / 10</div>

<!-- WISH PANEL -->

<div id="wish-panel">
  <div class="wish-content">
    <h2>MAKE A WISH</h2>
    <textarea id="wish-input" placeholder="Write your wish here..."></textarea>
    <div class="wish-buttons">
      <button id="close-wish">CLOSE ×</button>
      <button id="submit-wish">SEND WISH ↑</button>
    </div>
  </div>
</div>

<!-- THANK YOU -->

<div id="thank-you-screen">
  <div class="thank-you-image" id="thank-you-image">
    <h1>THANK<br>YOU</h1>
  </div>
</div>

<!-- BEER -->

<div id="beer-screen">
  <button id="beer-close">CLOSE ×</button>

  <div id="beer-glass">
    <div id="beer-liquid">
      <div id="beer-surface"></div>
      <div id="beer-foam"></div>
    </div>
    <div id="beer-label">BEER</div>
  </div>

  <div id="beer-hint">TILT YOUR PHONE TO DRINK</div>
</div>

<script>
const canvasArea = document.getElementById("canvas-area");
const counterDisplay = document.getElementById("click-counter");
const wishPanel = document.getElementById("wish-panel");
const wishInput = document.getElementById("wish-input");
const thankYouScreen = document.getElementById("thank-you-screen");
const thankYouImage = document.getElementById("thank-you-image");

const beerScreen = document.getElementById("beer-screen");
const beerGlass = document.getElementById("beer-glass");
const beerLiquid = document.getElementById("beer-liquid");
const beerSurface = document.getElementById("beer-surface");

let clickCount = 0;
let sensorsEnabled = false;
let beerMode = false;
let beerLevel = 82;
let lastBeta = 0;
let lastGamma = 0;
let lastShake = 0;

const colors = [
  "#ff0000", "#0000ff", "#00a651",
  "#ff6600", "#ff00aa", "#8b00ff",
  "#000000", "#ffcc00", "#00a6a6"
];

function random(min, max) {
  return Math.random() * (max - min) + min;
}

function randomImageNumber() {
  return Math.floor(Math.random() * 16) + 1;
}

/* SENSOR ACTIVATION ON FIRST TAP */

async function enableSensors() {
  if (sensorsEnabled) return;

  try {
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      const permission = await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") return;
    }

    if ("DeviceOrientationEvent" in window) {
      window.addEventListener("deviceorientation", handleOrientation);
      sensorsEnabled = true;
    }

    if ("DeviceMotionEvent" in window) {
      window.addEventListener("devicemotion", handleMotion);
    }
  } catch (error) {
    console.log("Motion sensors unavailable:", error);
  }
}

/* CREATE TEXT OR IMAGE */

function createMarko() {
  if (Math.random() < 0.08) {
    createRandomImage();
    return;
  }

  const element = document.createElement("div");
  element.className = "marko";
  element.textContent = Math.random() < 0.5 ? "MARKO" : "26";

  const size = random(20, 150);
  const rotation = random(-35, 35);
  const color = colors[Math.floor(Math.random() * colors.length)];

  element.style.left = random(0, window.innerWidth) + "px";
  element.style.top = random(0, window.innerHeight) + "px";
  element.style.fontSize = size + "px";
  element.style.fontWeight = Math.floor(random(100, 1001));
  element.style.color = color;
  element.style.fontStyle = Math.random() < 0.35 ? "italic" : "normal";
  element.style.setProperty("--rotation", rotation + "deg");

  canvasArea.appendChild(element);
}

function createRandomImage() {
  const image = document.createElement("img");
  image.className = "marko-image";
  image.src = `${randomImageNumber()}.png`;

  const size = random(50, 190);
  const rotation = random(-35, 35);

  image.style.width = size + "px";
  image.style.height = size + "px";
  image.style.left = random(0, window.innerWidth) + "px";
  image.style.top = random(0, window.innerHeight) + "px";
  image.style.setProperty("--rotation", rotation + "deg");

  canvasArea.appendChild(image);
}

function updateCounter() {
  counterDisplay.textContent = clickCount + " / 10";
}

function resetCanvas() {
  canvasArea.innerHTML = "";
  clickCount = 0;
  updateCounter();
}

/* CLICK TO CREATE CHAOS */

document.addEventListener("click", async function(event) {

  if (
    event.target.closest("button") ||
    event.target.closest("#wish-panel") ||
    event.target.closest("#thank-you-screen") ||
    event.target.closest("#beer-screen")
  ) return;

  if (wishPanel.style.display === "flex") return;

  await enableSensors();

  clickCount++;

  if (clickCount >= 10) {
    resetCanvas();
    return;
  }

  const amount = Math.floor(random(15, 61));

  for (let i = 0; i < amount; i++) {
    createMarko();
  }

  updateCounter();
});

/* DEVICE TILT */

function handleOrientation(event) {
  const beta = event.beta || 0;
  const gamma = event.gamma || 0;

  lastBeta = beta;
  lastGamma = gamma;

  if (beerMode) {
    updateBeer(beta, gamma);
    return;
  }

  const elements = document.querySelectorAll(".marko, .marko-image");

  elements.forEach(element => {
    const originalLeft = parseFloat(element.style.left);
    const originalTop = parseFloat(element.style.top);

    const moveX = gamma * 1.1;
    const moveY = beta * 0.7;

    element.style.marginLeft = moveX + "px";
    element.style.marginTop = moveY + "px";
  });
}

/* SHAKE EFFECT */

function handleMotion(event) {
  if (beerMode) return;

  const acceleration = event.accelerationIncludingGravity;
  if (!acceleration) return;

  const force =
    Math.abs(acceleration.x || 0) +
    Math.abs(acceleration.y || 0) +
    Math.abs(acceleration.z || 0);

  const now = Date.now();

  if (force > 35 && now - lastShake > 700) {
    lastShake = now;

    document.querySelectorAll(".marko, .marko-image").forEach(element => {
      element.style.transition = "transform 0.2s";
      element.style.translate = `${random(-35, 35)}px ${random(-35, 35)}px`;
    });
  }
}

/* PNG DOWNLOAD */

document.getElementById("download-button").addEventListener("click", async function() {
  await document.fonts.ready;

  const width = window.innerWidth;
  const height = window.innerHeight;
  const scale = 2;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = width * scale;
  canvas.height = height * scale;
  ctx.scale(scale, scale);

  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, width, height);

  const elements = document.querySelectorAll(".marko, .marko-image");

  await Promise.all(
    Array.from(document.querySelectorAll(".marko-image")).map(image => {
      if (image.complete && image.naturalWidth > 0) return Promise.resolve();

      return new Promise(resolve => {
        image.onload = resolve;
        image.onerror = resolve;
      });
    })
  );

  elements.forEach(element => {
    const rect = element.getBoundingClientRect();
    const style = window.getComputedStyle(element);

    ctx.save();
    ctx.translate(rect.left + rect.width / 2, rect.top + rect.height / 2);

    const rotation = parseFloat(element.style.getPropertyValue("--rotation")) || 0;
    ctx.rotate(rotation * Math.PI / 180);

    if (element.classList.contains("marko-image")) {
      if (element.complete && element.naturalWidth > 0) {
        ctx.drawImage(element, -rect.width / 2, -rect.height / 2, rect.width, rect.height);
      }
    } else {
      const size = parseFloat(style.fontSize);
      ctx.font = `${style.fontStyle} ${style.fontWeight} ${size}px "NationalCode"`;
      ctx.fillStyle = style.color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(element.textContent, 0, 0);
    }

    ctx.restore();
  });

  const link = document.createElement("a");
  link.download = "MARKO-26.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});

/* WISH PANEL */

document.getElementById("wish-button").addEventListener("click", function() {
  wishPanel.style.display = "flex";
  wishInput.focus();
});

document.getElementById("close-wish").addEventListener("click", function() {
  wishPanel.style.display = "none";
  wishInput.value = "";
});

function showRandomImage() {
  thankYouImage.style.backgroundImage = `url("${randomImageNumber()}.png")`;
}

document.getElementById("submit-wish").addEventListener("click", function() {
  if (wishInput.value.trim() === "") {
    wishInput.focus();
    return;
  }

  wishPanel.style.display = "none";
  wishInput.value = "";

  resetCanvas();
  showRandomImage();
  thankYouScreen.style.display = "flex";
});

thankYouScreen.addEventListener("click", function() {
  thankYouScreen.style.display = "none";
  resetCanvas();
});

/* BEER MODE */

document.getElementById("beer-button").addEventListener("click", async function() {
  await enableSensors();

  beerMode = true;
  beerLevel = 82;
  beerLiquid.style.height = beerLevel + "%";
  beerScreen.style.display = "flex";

  updateBeer(lastBeta, lastGamma);
});

document.getElementById("beer-close").addEventListener("click", function(event) {
  event.stopPropagation();
  closeBeer();
});

function updateBeer(beta, gamma) {
  // Tilt controls the angle of the glass and the beer surface
  const tilt = Math.max(-55, Math.min(55, gamma));
  beerGlass.style.transform = `perspective(700px) rotate(${tilt * 0.65}deg)`;

  beerSurface.style.transform =
    `translateY(${beta * 0.5}px) rotate(${-gamma * 0.8}deg)`;

  // When the phone is tilted strongly, the beer level drops
  if (beta > 55 || beta < -55) {
    beerLevel = Math.max(0, beerLevel - 0.12);
    beerLiquid.style.height = beerLevel + "%";
  }

  // Refill when the phone is brought upright again
  if (Math.abs(beta) < 25 && Math.abs(gamma) < 25) {
    beerLevel = Math.min(82, beerLevel + 0.025);
    beerLiquid.style.height = beerLevel + "%";
  }

  if (beerLevel <= 0) {
    beerGlass.style.opacity = "0.55";
  } else {
    beerGlass.style.opacity = "1";
  }
}

function closeBeer() {
  beerMode = false;
  beerScreen.style.display = "none";
  beerGlass.style.transform = "perspective(700px) rotate(0deg)";
  beerGlass.style.opacity = "1";
}

/* BUBBLES */

for (let i = 0; i < 18; i++) {
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.style.left = random(5, 95) + "%";
  bubble.style.animationDelay = random(0, 3) + "s";
  bubble.style.animationDuration = random(1.5, 4) + "s";
  beerLiquid.appendChild(bubble);
}
</script>

</body>
</html>
